<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>Weather∞</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0a0a0a}
body{font-family:"Helvetica Neue",system-ui,'Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Tamil','Noto Sans Telugu','Noto Sans Gujarati','Noto Sans Arabic','Noto Sans JP','Noto Sans KR','Noto Sans SC',Arial,sans-serif;color:#fff}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.wrap{position:relative;z-index:1;max-width:600px;margin:auto;padding:calc(14px + var(--gap)) 14px 60px}
:root{--gap:0px}
html,body{overscroll-behavior-y:none}
.win{background:rgba(10,10,10,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);border-radius:26px;padding:16px;margin:14px 0}
.row{display:flex;gap:8px;align-items:center}
input,select{flex:1;min-width:0;padding:11px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#fff;font-size:1rem;outline:0}
select{flex:0 0 auto;padding:8px 10px}select option{color:#000}
input::placeholder{color:rgba(255,255,255,.45)}
button{padding:10px 18px;border:0;border-radius:20px;background:#fff;color:#000;font-weight:600;font-size:.92rem;cursor:pointer}
.bar2{display:flex;justify-content:space-between;align-items:center;margin:10px 2px}
.brand{letter-spacing:.35em;font-size:.8rem;opacity:.7}
h3{margin:0 0 4px;font-weight:500;font-size:1.02rem}
.sub{opacity:.55;font-size:.85rem}
.aqi{display:flex;align-items:center;gap:14px}
.aqi>b{font-size:2.6rem;font-weight:300;line-height:1}
.bar{height:4px;border-radius:4px;background:linear-gradient(90deg,#2ecc71,#f1c40f,#ff9f1a,#ff4d4d,#b455ff,#c2223d);margin-top:12px;position:relative}
.bar s{position:absolute;top:-4px;width:3px;height:12px;background:#fff;border-radius:2px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.big{font-size:6.2rem;font-weight:200;line-height:.95;letter-spacing:-.03em}
.right{text-align:right;font-size:1.05rem}
.right svg{width:34px;height:34px;vertical-align:middle;margin-right:6px}
.city{opacity:.7;margin:0 0 6px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
.grid div,.kpis div{background:rgba(255,255,255,.05);border-radius:16px;padding:9px 13px;font-size:.92rem}
small{display:block;opacity:.5;font-size:.72rem;letter-spacing:.04em}
.tips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.tips h4{margin:0 0 4px;font-weight:500}.tips ul{margin:0;padding-left:16px;font-size:.88rem;opacity:.9}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.12)}
.tabs button.on{background:#fff;color:#000}
.stk{position:sticky;top:8px;z-index:5;padding:6px;border-radius:24px;background:rgba(10,10,10,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);margin:14px 0}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin-top:12px}
.hr{min-width:60px;text-align:center;font-size:.85rem}
.hr svg,.dy svg{width:30px;height:30px;margin:4px 0}
.dy{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.dy span:first-child{width:70px}.dy span:last-child{margin-left:auto}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.92rem}
td,th{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.08);text-align:center;font-weight:400}
td:first-child{text-align:left;opacity:.55}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kpis b{display:block;font-size:1.15rem;font-weight:400}
.cb{position:relative;margin-top:8px;touch-action:pan-y}
.tip{position:absolute;top:0;left:44px;font-size:.78rem;background:#000;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:5px 8px;pointer-events:none;display:none;white-space:nowrap}
.err{color:#ff8b8b;padding:8px}
.d{animation:fall 1s linear infinite}.bl{animation:fl 2.4s infinite}
@keyframes fall{from{transform:translateY(-3px);opacity:1}to{transform:translateY(8px);opacity:0}}
@keyframes fl{0%,60%,100%{opacity:.25}70%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== v8 themes ===== */
html[data-th=black],html[data-th=black] body,html[data-th=space],html[data-th=space] body{background:#000}
[data-th=black] .win,[data-th=black] .stk{background:#050505;-webkit-backdrop-filter:none;backdrop-filter:none;border-color:rgba(255,255,255,.1)}
[data-th=black] .grid div,[data-th=black] .kpis div,[data-th=black] .tp,[data-th=black] .tp2,[data-th=black] .dst div,[data-th=black] .dhr div{background:#0e0e0e;border-color:rgba(255,255,255,.08)}
[data-th=black] .dsl{background:#060606;border-color:rgba(255,255,255,.12);-webkit-backdrop-filter:none;backdrop-filter:none}
[data-th=black] input,[data-th=black] select{background:#0e0e0e}
[data-th=black] .tabs button,[data-th=black] .seg2,[data-th=black] .chip,[data-th=black] .ic2,[data-th=black] .ic3,[data-th=black] .pill{background:#111}
[data-th=black] .tabs button.on,[data-th=black] .chip.on,[data-th=black] .ic2.on,[data-th=black] .pill.on{background:#fff;color:#000}
[data-th=black] .seg2 button{background:transparent}[data-th=black] .seg2 button.on{background:#fff;color:#000}
[data-th=black] #thp,[data-th=black] #sug,[data-th=black] #sug2{background:#050505}
[data-th=black] .ncb i{background:#1a1a1a}[data-th=black] .ncb i.w{background:#cfd6e4}
[data-th=black] .nrh .bb,[data-th=black] .segs i{background:#1a1a1a}
[data-th=black] #map{background:#050505}
[data-th=black] .vzc{opacity:.55;filter:grayscale(.85)}
[data-th=space] .win,[data-th=space] .stk{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border-color:transparent;box-shadow:none}
[data-th=space] .up{box-shadow:none}
[data-th=space] .vz{background:transparent!important}
[data-th=space] .vzc{opacity:.14}
[data-th=space] input,[data-th=space] select{background:transparent;border-color:rgba(255,255,255,.2)}
[data-th=space] .ctg{background:transparent}
[data-th=space] .tp2{border-color:transparent}
[data-th=space] #clkW{background:transparent!important;border-color:transparent!important}
[data-th=space] .tabs button{background:transparent;border-color:rgba(255,255,255,.18)}[data-th=space] .tabs button.on{background:#fff}
[data-th=space] .grid div,[data-th=space] .kpis div,[data-th=space] .tp,[data-th=space] .tp2,[data-th=space] .dst div,[data-th=space] .dhr div{background:transparent;border-color:transparent}
[data-th=space] .dsl{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border-color:rgba(255,255,255,.12)}
[data-th=space] #dw.on{background:rgba(0,0,0,.9);-webkit-backdrop-filter:none;backdrop-filter:none}
[data-th=space] #thp,[data-th=space] #sug,[data-th=space] #sug2{background:#030305}
[data-th=space] .wrap>.win:not(:first-child),[data-th=space] #app>.win{animation:sway 7s ease-in-out infinite;animation-delay:calc(var(--fi,0) * -1.4s)}
[data-th=space] .wrap>.win:first-child,[data-th=space] .stk{animation:none}
@keyframes sway{0%,100%{transform:translate3d(0,0,0) rotate(0)}22%{transform:translate3d(1.6px,-2px,0) rotate(.12deg)}50%{transform:translate3d(-1.2px,1.6px,0) rotate(-.1deg)}76%{transform:translate3d(1px,1.2px,0) rotate(.08deg)}}

/* ===== v10 sky header + pull to refresh ===== */
#skyH{position:relative;min-height:calc(100vh - 150px);display:flex;flex-direction:column;justify-content:flex-start;padding-top:40px;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.4)}
#skyH>*{pointer-events:auto}#skyH>#skyT{pointer-events:none}
#skyH #clkW{margin:18px 0 0;text-shadow:none}
#skyT{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
#skyH #aqi{pointer-events:auto;margin:16px 0 0;padding:0;background:transparent!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;text-shadow:none}
#skyH .pl{font-size:1.08rem;font-weight:400;opacity:.92;margin-bottom:2px;max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#skyH .tm{font-size:6.2rem;font-weight:200;line-height:1;letter-spacing:-.03em;margin-left:-.04em}
#skyH .rt{text-align:right;padding-bottom:10px;font-size:1.02rem}
#skyH .rt svg{width:34px;height:34px;vertical-align:middle;margin-right:6px;display:inline-block}
#skyH .rt .sub{font-size:.8rem;margin-top:3px;opacity:.75}
.brand{position:absolute;top:16px;left:16px;z-index:3;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.bar2{justify-content:flex-end}
#hero .hero{display:none}
[data-th=white] #skyH{color:#0f1420;text-shadow:none}
#ptr{position:fixed;left:50%;top:0;z-index:95;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:rgba(20,20,24,.92);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;color:#fff;transform:translateY(-60px);opacity:0;pointer-events:none}
#ptr svg{width:20px;height:20px}
#ptr.go svg{animation:spin 1s linear infinite}
[data-th=white] #ptr{background:#fff;color:#0f1420;border-color:rgba(0,0,0,.2)}

/* ===== v13: search bar lives at the bottom of the screen ===== */
#sbar{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:572px;bottom:calc(12px + env(safe-area-inset-bottom));margin:0!important;z-index:50}
#sug{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:572px;top:auto;bottom:calc(84px + env(safe-area-inset-bottom));max-height:46vh;overflow-y:auto;z-index:55}
.wrap{padding-bottom:110px}
#toast{bottom:92px}
[data-th=space] #sbar{background:transparent;border-color:transparent}
[data-th=space] .wrap>.win#sbar{animation:none}
[data-th=space] #q{background:rgba(0,0,0,.9);border-color:rgba(255,255,255,.22)}
[data-th=space] .ic2,[data-th=space] .ic3,[data-th=space] .seg2,[data-th=space] .chip,[data-th=space] .pill{background:transparent}
[data-th=space] .ic2.on,[data-th=space] .chip.on,[data-th=space] .pill.on{background:#fff}

/* ===== v15: every tile and window fully invisible (clock keeps its black card except in the space theme) ===== */
html[data-th] .win:not(#clkW),html[data-th] .stk,html[data-th] .dsl,html[data-th] .grid div,html[data-th] .kpis div,html[data-th] .tp,html[data-th] .tp2,html[data-th] .dst div,html[data-th] .dhr div{background:transparent!important;border-color:transparent!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
html[data-th] .up{box-shadow:none!important}
[data-th=sky] .win,[data-th=green] .win,[data-th=dots] .win{text-shadow:0 1px 9px rgba(0,0,0,.4)}
#sbar #q{background:rgba(10,10,14,.82)}[data-th=white] #sbar #q{background:rgba(255,255,255,.92)}
/* search suggestions sit directly above the search bar */
#sbar{left:14px;right:14px;width:auto;transform:none;margin-left:auto!important;margin-right:auto!important}
#sbar #sug{position:absolute;left:0;right:0;top:auto;bottom:calc(100% + 8px);width:auto;max-width:none;transform:none;max-height:min(46vh,380px);overflow-y:auto}
/* behind a pop-up the page is blurred hard */
#dw.on,[data-th=space] #dw.on{background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
[data-th=white] #dw.on{background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}

/* ===== v16: customize panel (transparency + up/down shift, saved per theme) ===== */
:root{--tp:0;--sh:0px;--tc:10,10,14}
html[data-th] .win:not(#clkW),html[data-th] .stk,html[data-th] .dsl{background:rgba(var(--tc),calc(var(--tp) * .88))!important;border-color:rgba(var(--bc,255,255,255),calc(var(--tp) * .13))!important;-webkit-backdrop-filter:blur(calc(var(--tp) * 16px))!important;backdrop-filter:blur(calc(var(--tp) * 16px))!important}
html[data-th] .grid div,html[data-th] .kpis div,html[data-th] .tp,html[data-th] .tp2,html[data-th] .dst div,html[data-th] .dhr div{background:rgba(var(--bc,255,255,255),calc(var(--tp) * .08))!important;border-color:transparent!important}
[data-th=white]{--tc:255,255,255;--bc:0,0,0}
.bar2{margin:0;height:0}
.bar2>.row{position:absolute;top:8px;right:14px;z-index:6}
#thw #thp{position:fixed;top:60px;right:14px;left:auto}
.tools{margin-top:calc(4px + var(--sh))}
#lang{max-width:104px;text-overflow:ellipsis}
#cst{position:fixed;left:14px;right:14px;max-width:572px;margin:0 auto;bottom:calc(86px + env(safe-area-inset-bottom));z-index:70;display:none;padding:16px 18px 14px;border-radius:26px;background:rgba(14,14,18,.97);border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 50px rgba(0,0,0,.55);color:#fff}
#cst.open{display:block}
[data-th=white] #cst{background:#fff;color:#0f1420;border-color:rgba(0,0,0,.14);box-shadow:0 18px 50px rgba(0,0,0,.2)}
#cst h4{margin:0 0 10px;font-weight:500;font-size:1.02rem;display:flex;justify-content:space-between;align-items:center}
#cst h4 button{padding:0;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.1);color:inherit;font-size:1rem}
[data-th=white] #cst h4 button{background:rgba(0,0,0,.08)}
#cst label{display:flex;justify-content:space-between;font-size:.86rem;opacity:.85;margin-top:10px}
#cst input[type=range]{width:100%;flex:none;padding:0;border:0;background:none;height:30px;accent-color:#fff;margin:0}
[data-th=white] #cst input[type=range]{accent-color:#0f1420}
#cst .cb2{display:flex;gap:8px;margin-top:10px}#cst .cb2 button{flex:1}
#cst .cb2 button.gh{background:rgba(255,255,255,.1);color:inherit}[data-th=white] #cst .cb2 button.gh{background:rgba(0,0,0,.08)}

:root{--fg:#fff}
.win,.grid div,.kpis div,.tp{cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.up{transform:translateY(-12px) scale(1.03)!important;box-shadow:0 26px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.28);z-index:30;position:relative}
.win,.cb{color:var(--fg)}
#sug{position:absolute;left:14px;right:14px;top:66px;z-index:40;background:rgba(14,14,14,.97);border:1px solid rgba(255,255,255,.14);border-radius:20px;overflow:hidden;display:none}
#sug div{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}#sug small{opacity:.55}
.tbar{height:10px;border-radius:8px;position:relative;margin:12px 0 4px}.tbar i{position:absolute;top:-3px;width:3px;height:16px;background:#fff;border-radius:2px;box-shadow:0 0 5px #000}
canvas.sc{width:100%;height:230px;display:block;border-radius:18px;margin:8px 0}
.mrow{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.tpg{display:grid;gap:10px;margin-top:10px}
.tp{background:rgba(255,255,255,.05);border-radius:18px;padding:12px 14px}
.tp h4{margin:0 0 2px;font-weight:500}.tp ul{margin:2px 0 6px;padding-left:18px;font-size:.88rem}
.g{color:#5be38f}.r{color:#ff8b8b}
#map{height:320px;border-radius:18px;overflow:hidden;margin-top:10px;background:#111}
html:not([data-th=white]) .base{filter:invert(1) hue-rotate(180deg) brightness(.85) saturate(.5)}
[data-th=white],[data-th=white] body{background:#f3f5f8;color:#0f1420;--fg:#0f1420}

[data-th=white] input,[data-th=white] select{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.12);color:#0f1420}

[data-th=white] button{background:#0f1420;color:#fff}

[data-th=white] td,[data-th=white] th,[data-th=white] .dy{border-color:rgba(0,0,0,.08)}

[data-th=white] .g{color:#119953}[data-th=white] .r{color:#d63a3a}

*{-webkit-tap-highlight-color:transparent}
body{touch-action:manipulation}
button,select,input,.win,.grid div,.kpis div,.tp,.cb,canvas,svg{outline:0}
button:focus,select:focus{outline:0}
.win,.grid div,.kpis div,.tp,.tabs button,.ic2,.brand{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
::selection{background:rgba(150,150,150,.35)}
#thw{position:relative}
.ic2{width:40px;height:40px;padding:0;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center}

.ic2.on{background:#fff;color:#000}

[data-th=white] #thp{background:#fff;border-color:rgba(0,0,0,.14);box-shadow:0 14px 40px rgba(0,0,0,.18)}
.vz{position:relative;overflow:hidden}
.vzc{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none}
.vzi{position:relative;z-index:1}

/* ===== v4 ===== */
.tools{margin:4px 2px 0;gap:8px;flex-wrap:wrap}
.seg2{display:inline-flex;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);padding:3px}
.seg2 button{padding:7px 12px;background:transparent;color:inherit;border-radius:999px;font-size:.78rem;font-weight:600}
.seg2 button.on{background:#fff;color:#000}
#bell{margin-left:auto}
.favs{display:none;gap:8px;overflow-x:auto;padding:10px 2px 2px}
.chip{flex:none;display:inline-flex;align-items:center;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);font-size:.82rem;font-weight:500}
.chip.on{background:#fff;color:#000}
.chip button{padding:0;background:transparent;color:inherit;border-radius:0;font-size:.82rem;font-weight:500}
.chip .cx{margin-left:9px;opacity:.55;font-size:1rem;line-height:1}
.ic3{width:34px;height:34px;padding:0;border-radius:50%;background:rgba(255,255,255,.08);color:inherit;border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;font-size:16px;line-height:1}
.ic3 svg{width:17px;height:17px;display:block}
.ic3.on{color:#ffc83d}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#sug2{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:rgba(14,14,14,.97);border:1px solid rgba(255,255,255,.14);border-radius:20px;overflow:hidden;display:none}
#sug2 div{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}#sug2 small{opacity:.55}
#cmpW{position:relative;z-index:20}

#toast.show{opacity:1;transform:translate(-50%,0)}
