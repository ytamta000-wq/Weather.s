<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather∞</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0a0a0a}
body{font-family:"Helvetica Neue",system-ui,'Noto Sans Devanagari',Arial,sans-serif;color:#fff}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.wrap{position:relative;z-index:1;max-width:600px;margin:auto;padding:14px 14px 60px}
.win{background:rgba(10,10,10,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);border-radius:26px;padding:16px;margin:14px 0}
.row{display:flex;gap:8px;align-items:center}
input,select{flex:1;min-width:0;padding:11px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#fff;font-size:1rem;outline:0}
select{flex:0 0 auto;padding:8px 10px}select option{color:#000}
input::placeholder{color:rgba(255,255,255,.45)}
button{padding:10px 18px;border:0;border-radius:20px;background:#fff;color:#000;font-weight:600;font-size:.92rem;cursor:pointer}
.bar2{display:flex;justify-content:space-between;align-items:center;margin:10px 2px}
.brand{letter-spacing:.35em;font-size:.8rem;opacity:.7}
h3{margin:0 0 4px;font-weight:500;font-size:1.02rem}
.sub{opacity:.55;font-size:.85rem}
.aqi{display:flex;align-items:center;gap:14px}
.aqi>b{font-size:2.6rem;font-weight:300;line-height:1}
.bar{height:4px;border-radius:4px;background:linear-gradient(90deg,#2ecc71,#f1c40f,#ff9f1a,#ff4d4d,#b455ff,#c2223d);margin-top:12px;position:relative}
.bar s{position:absolute;top:-4px;width:3px;height:12px;background:#fff;border-radius:2px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.big{font-size:6.2rem;font-weight:200;line-height:.95;letter-spacing:-.03em}
.right{text-align:right;font-size:1.05rem}
.right svg{width:34px;height:34px;vertical-align:middle;margin-right:6px}
.city{opacity:.7;margin:0 0 6px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
.grid div,.kpis div{background:rgba(255,255,255,.05);border-radius:16px;padding:9px 13px;font-size:.92rem}
small{display:block;opacity:.5;font-size:.72rem;letter-spacing:.04em}
.tips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.tips h4{margin:0 0 4px;font-weight:500}.tips ul{margin:0;padding-left:16px;font-size:.88rem;opacity:.9}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.12)}
.tabs button.on{background:#fff;color:#000}
.stk{position:sticky;top:8px;z-index:5;padding:6px;border-radius:24px;background:rgba(10,10,10,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);margin:14px 0}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin-top:12px}
.hr{min-width:60px;text-align:center;font-size:.85rem}
.hr svg,.dy svg{width:30px;height:30px;margin:4px 0}
.dy{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.dy span:first-child{width:70px}.dy span:last-child{margin-left:auto}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.92rem}
td,th{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.08);text-align:center;font-weight:400}
td:first-child{text-align:left;opacity:.55}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kpis b{display:block;font-size:1.15rem;font-weight:400}
.cb{position:relative;margin-top:8px;touch-action:pan-y}
.tip{position:absolute;top:0;left:44px;font-size:.78rem;background:#000;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:5px 8px;pointer-events:none;display:none;white-space:nowrap}
.err{color:#ff8b8b;padding:8px}
.d{animation:fall 1s linear infinite}.bl{animation:fl 2.4s infinite}
@keyframes fall{from{transform:translateY(-3px);opacity:1}to{transform:translateY(8px);opacity:0}}
@keyframes fl{0%,60%,100%{opacity:.25}70%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

:root{--fg:#fff}
.win,.grid div,.kpis div,.tp{cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.up{transform:translateY(-12px) scale(1.03)!important;box-shadow:0 26px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.28);z-index:30;position:relative}
.win,.cb{color:var(--fg)}
#sug{position:absolute;left:14px;right:14px;top:66px;z-index:40;background:rgba(14,14,14,.97);border:1px solid rgba(255,255,255,.14);border-radius:20px;overflow:hidden;display:none}
#sug div{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}#sug small{opacity:.55}
.tbar{height:10px;border-radius:8px;position:relative;margin:12px 0 4px}.tbar i{position:absolute;top:-3px;width:3px;height:16px;background:#fff;border-radius:2px;box-shadow:0 0 5px #000}
canvas.sc{width:100%;height:230px;display:block;border-radius:18px;margin:8px 0}
.mrow{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.tpg{display:grid;gap:10px;margin-top:10px}
.tp{background:rgba(255,255,255,.05);border-radius:18px;padding:12px 14px}
.tp h4{margin:0 0 2px;font-weight:500}.tp ul{margin:2px 0 6px;padding-left:18px;font-size:.88rem}
.g{color:#5be38f}.r{color:#ff8b8b}
#map{height:320px;border-radius:18px;overflow:hidden;margin-top:10px;background:#111}
html:not([data-th=white]) .base{filter:invert(1) hue-rotate(180deg) brightness(.85) saturate(.5)}
[data-th=white],[data-th=white] body{background:#f3f5f8;color:#0f1420;--fg:#0f1420}
[data-th=white] .win,[data-th=white] .stk{background:rgba(255,255,255,.84);border-color:rgba(0,0,0,.08)}
[data-th=white] input,[data-th=white] select{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.12);color:#0f1420}
[data-th=white] input::placeholder{color:rgba(0,0,0,.45)}
[data-th=white] button{background:#0f1420;color:#fff}
[data-th=white] .tabs button{background:rgba(0,0,0,.05);color:#0f1420;border-color:rgba(0,0,0,.1)}
[data-th=white] .tabs button.on{background:#0f1420;color:#fff}
[data-th=white] .grid div,[data-th=white] .kpis div,[data-th=white] .tp{background:rgba(0,0,0,.04)}
[data-th=white] td,[data-th=white] th,[data-th=white] .dy{border-color:rgba(0,0,0,.08)}
[data-th=white] .tip,[data-th=white] #sug{background:#fff;color:#0f1420;border-color:rgba(0,0,0,.15)}
[data-th=white] .g{color:#119953}[data-th=white] .r{color:#d63a3a}
[data-th=white] .up{box-shadow:0 22px 50px rgba(0,0,0,.22)}
</style>
</head>

</div>

  const hr = probs.findIndex(p => p >= 50), nx = hr === 0 ? t('n0') : hr > 0 ? t('nN').replace('{n}', hr) : t('nX'), li = a => a.length ? a.map(x => `<li>${x}</li>`).join('') : `<li>${L === 'hi' ? 'कोई खास परहेज़ नहीं' : 'Nothing special'}</li>`;

}
const summ = o => { const w = o.w, c = w.current, d = todayIdx(w); return { tp: c.temperature_2m, fl: c.apparent_temperature, hu: c.relative_humidity_2m, wi: c.wind_speed_10m, ra: w.daily.precipitation_probability_max[d], uv: w.daily.uv_index_max[d], aq: o.q && o.q.current ? o.q.current.us_aqi : null }; };

/* ---------- dashboard ---------- */
async function series(n) {
  const key = W.w.current.time.slice(0, 13);
  if (!W.big) W.big = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${place.lat}&longitude=${place.lon}&timezone=auto&hourly=temperature_2m,precipitation,snowfall,wind_speed_10m,pressure_msl&past_days=92&forecast_days=1`);
  const h = W.big.hourly; let i = h.time.findIndex(x => x.startsWith(key)); if (i < 0) i = h.time.length - 1;
  const sl = (k, a, b) => h[k].slice(a, b).map(v => v == null ? 0 : v), sm = a => a.reduce((x, y) => x + y, 0);
  if (n === 1) { const a = Math.max(i - 23, 0); return { lb: h.time.slice(a, i + 1).map(x => x.slice(11, 16)), hi: sl('temperature_2m', a, i + 1), lo: null, rain: sl('precipitation', a, i + 1), snow: sl('snowfall', a, i + 1), wind: sl('wind_speed_10m', a, i + 1), pr: sl('pressure_msl', a, i + 1) }; }
  const e = Math.floor(i / 24), o = { lb: [], hi: [], lo: [], rain: [], snow: [], wind: [], pr: [] };
  for (let d = Math.max(e - n + 1, 0); d <= e; d++) { const a = d * 24, b = Math.min(a + 24, i + 1), tt = sl('temperature_2m', a, b), P = sl('pressure_msl', a, b); o.lb.push(h.time[a].slice(5)); o.hi.push(Math.max(...tt)); o.lo.push(Math.min(...tt)); o.rain.push(sm(sl('precipitation', a, b))); o.snow.push(sm(sl('snowfall', a, b))); o.wind.push(Math.max(...sl('wind_speed_10m', a, b))); o.pr.push(sm(P) / P.length); }
  return o;
}
function chart(box, lb, ser, type, u, m0) {
  const Wd = 640, H = 230, Lm = 46, R = 10, Tm = 12, B = 26, N = lb.length, IW = Wd - Lm - R, all = ser.flatMap(s => s.d); let mn = Math.min(...all), mx = Math.max(...all);
  if (type === 'bar') { mn = 0; mx = Math.max(mx, m0 || 1) * 1.1; } else { if (mx - mn < (m0 || 2)) { const m = ((m0 || 2) - (mx - mn)) / 2; mn -= m; mx += m; } const pd = (mx - mn) * .08; mn -= pd; mx += pd; }
  const sp = mx - mn, dec = sp < 1 ? 2 : sp < 10 ? 1 : 0, X = i => Lm + (type === 'bar' ? (i + .5) * IW / N : i * IW / Math.max(1, N - 1)), Y = v => Tm + (1 - (v - mn) / sp) * (H - Tm - B);
  let s = `<svg viewBox="0 0 ${Wd} ${H}" width="100%">`;
  for (let j = 0; j <= 4; j++) { const v = mn + sp * j / 4, y = Y(v); s += `<line x1="${Lm}" x2="${Wd - R}" y1="${y}" y2="${y}" stroke="currentColor" stroke-opacity=".12"/><text x="${Lm - 6}" y="${y + 4}" fill="currentColor" fill-opacity=".6" font-size="11" text-anchor="end">${v.toFixed(dec)}</text>`; }
  for (let j = 0; j < 5; j++) { const i = Math.round(j * (N - 1) / 4); s += `<text x="${X(i)}" y="${H - 6}" fill="currentColor" fill-opacity=".6" font-size="11" text-anchor="middle">${lb[i]}</text>`; }
  if (type === 'bar') { const bw = Math.max(2, IW / N * .62); ser[0].d.forEach((v, i) => { if (v > 0) s += `<rect x="${X(i) - bw / 2}" y="${Y(v)}" width="${bw}" height="${Math.max(1, Y(0) - Y(v))}" rx="${Math.min(3, bw / 2)}" fill="${ser[0].c}"/>`; }); }
  else { const pts = d => d.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1)); s += `<polygon points="${pts(ser[0].d).concat(ser[1] ? pts(ser[1].d).reverse() : [X(N - 1) + ',' + Y(mn), X(0) + ',' + Y(mn)]).join(' ')}" fill="currentColor" fill-opacity=".08"/>`;
    ser.forEach(z => { for (let i = 1; i < N; i++) s += `<line x1="${X(i - 1)}" y1="${Y(z.d[i - 1])}" x2="${X(i)}" y2="${Y(z.d[i])}" stroke="${z.cf ? z.cf((z.d[i - 1] + z.d[i]) / 2) : z.c}" stroke-width="2.4" stroke-linecap="round"/>`; }); }
  s += `<line class="cur" y1="${Tm}" y2="${H - B}" stroke="currentColor" stroke-opacity=".5" style="display:none"/></svg><div class="tip"></div>`; box.innerHTML = s;
  const sv = box.querySelector('svg'), cur = box.querySelector('.cur'), tip = box.querySelector('.tip');
  const mv = e => { const r = sv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * Wd; let i = type === 'bar' ? Math.floor((x - Lm) / (IW / N)) : Math.round((x - Lm) / (IW / Math.max(1, N - 1))); i = Math.max(0, Math.min(N - 1, i));
    cur.setAttribute('x1', X(i)); cur.setAttribute('x2', X(i)); cur.style.display = 'block'; tip.style.display = 'block'; tip.innerHTML = `<b>${lb[i]}</b> ` + ser.map(z => `<span style="color:${z.cf ? z.cf(z.d[i]) : z.c}">${z.n ? z.n + ' ' : ''}${+z.d[i].toFixed(2)}${u}</span>`).join(' · '); };
  sv.addEventListener('pointermove', mv); sv.addEventListener('pointerdown', mv);
}
async function drawDash(n) {
  RANGE = n; const o = $('dash'); o.innerHTML = `<div class="win sub">${t('load')}</div>`;
  try {
    const S = await series(n), lo = S.lo || S.hi, sm = a => a.reduce((x, y) => x + y, 0), mean = (sm(S.hi) + sm(lo)) / (S.hi.length * 2), mxT = Math.max(...S.hi), mnT = Math.min(...lo), tr = sm(S.rain), ts = sm(S.snow), rd = S.rain.filter(x => x > (n === 1 ? .1 : 1)).length;
    const kp = [[t('kavg'), Math.round(mean) + '°', tc(mean)], [t('kmax'), Math.round(mxT) + '°', tc(mxT)], [t('kmin'), Math.round(mnT) + '°', tc(mnT)], [t('ktr'), tr.toFixed(1) + ' mm', '', rd + ' ' + (n === 1 ? t('rdh') : t('rdd'))], [t('kts'), ts.toFixed(1) + ' cm'], [t('kw'), Math.round(Math.max(...S.wind)) + ' km/h']];
    const win = (id, ti, de, ex = '') => `<section class="win"><h3>${ti}</h3><div class="sub">${de || ''}</div>${ex}<div class="cb" id="${id}"></div></section>`, pos = clamp((mean + 40) / 82, 0, 1) * 98;
    o.innerHTML = `<section class="win"><div class="kpis">${kp.map(x => `<div><small>${x[0]}</small><b style="color:${x[2] || 'inherit'}">${x[1]}</b>${x[3] ? `<small>${x[3]}</small>` : ''}</div>`).join('')}</div></section>`
      + win('c1', t('cT'), t('cTd'), `<div class="tbar" style="background:${TG}"><i style="left:${pos}%"></i></div>`) + win('c2', t('cR'), tr > 0 ? tr.toFixed(1) + ' mm' : t('noRain')) + win('c4', t('snow'), ts > 0 ? ts.toFixed(1) + ' cm' : t('noSnow')) + win('c3', t('cW'), 'km/h') + win('c5', t('press'), Math.round(S.pr[S.pr.length - 1]) + ' hPa');
    chart($('c1'), S.lb, S.lo ? [{ d: S.hi, cf: tc, n: t('hi') }, { d: S.lo, cf: tc, n: t('lo') }] : [{ d: S.hi, cf: tc, n: t('temp') }], 'band', '°', 3);
    chart($('c2'), S.lb, [{ d: S.rain, c: '#2f8bff' }], 'bar', ' mm', n === 1 ? 1 : 5); chart($('c4'), S.lb, [{ d: S.snow, c: '#8fc4ff' }], 'bar', ' cm', n === 1 ? 1 : 5);
    chart($('c3'), S.lb, [{ d: S.wind, c: '#2fd6a8' }], 'band', ' km/h', 6); chart($('c5'), S.lb, [{ d: S.pr, c: '#a17cff' }], 'band', ' hPa', 4);
  } catch (e) { o.innerHTML = `<div class="win err">${e.message}</div>`; }
}
/* ---------- radar ---------- */
let MAP = null, RL = null, MK = null;
async function radar() {
  const LF = window.L, m = $('rmsg'); m.textContent = '';
  try {
    if (!LF) throw 0; if (!MAP) { MAP = LF.map('map', { attributionControl: false }); LF.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 12, className: 'base' }).addTo(MAP); }
    MAP.setView([place.lat, place.lon], 6); if (MK) MAP.removeLayer(MK); MK = LF.circleMarker([place.lat, place.lon], { radius: 7, color: '#fff', fillColor: '#4da3ff', fillOpacity: 1 }).addTo(MAP); setTimeout(() => MAP.invalidateSize(), 400);
    const j = await getJSON('https://api.rainviewer.com/public/weather-maps.json'), f = j.radar.past[j.radar.past.length - 1]; if (RL) MAP.removeLayer(RL);
    RL = LF.tileLayer(`${j.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`, { opacity: .75, maxNativeZoom: 7, maxZoom: 12 }).addTo(MAP);
    m.textContent = 'Radar: RainViewer.com · Map: © OpenStreetMap contributors · ' + new Date(f.time * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } catch (e) { m.textContent = t('rf'); }
}

/* ---------- start ---------- */
async function load(name) {
  $('msg').className = 'sub'; $('msg').textContent = t('load');
  try {
    place = typeof name === 'object' && name ? name : name ? await findCity(name) : place; W = await getWeather(place); render();
    $('msg').textContent = ''; $('app').hidden = false; drawSky(); if (MAP) MAP.invalidateSize();
    try { localStorage.setItem('place', JSON.stringify(place)); } catch (e) { }
  } catch (e) { $('msg').className = 'err'; $('msg').textContent = e.message; }
}
function applyLang() {
  document.documentElement.lang = L; buildTheme();
  document.querySelectorAll('[data-i]').forEach(e => e.textContent = t(e.dataset.i));
  document.querySelectorAll('[data-p]').forEach(e => e.placeholder = t(e.dataset.p));

}
function tabs(id, fn) { $(id).onclick = e => { const b = e.target.closest('button'); if (!b) return; $(id).querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); fn(b); }; }
tabs('ftabs', b => { $('hourly').hidden = b.dataset.v !== 'hourly'; $('daily').hidden = b.dataset.v !== 'daily'; });
tabs('dtabs', b => drawDash(+b.dataset.n));

$('q').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('cmpb').onclick = compare; $('q2').onkeydown = e => { if (e.key === 'Enter') compare(); };

$('theme').onchange = e => { TH = e.target.value; document.documentElement.dataset.th = TH; try { localStorage.setItem('theme', TH); } catch (x) { } };
try { TH = localStorage.getItem('theme') || 'dots'; } catch (e) { } document.documentElement.dataset.th = TH;
let tm; const sug = $('sug');
function pick(r) { sug.innerHTML = ''; r.slice(0, 8).forEach(p => { const d = document.createElement('div'); d.innerHTML = `${p.name}<br><small>${p.sub || ''}</small>`; d.onclick = () => { sug.style.display = 'none'; $('q').value = p.name.split(',')[0]; load(p); }; sug.appendChild(d); }); sug.style.display = r.length ? 'block' : 'none'; }

</script>
