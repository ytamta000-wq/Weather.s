<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather∞</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0a0a0a}
body{font-family:"Helvetica Neue",system-ui,'Noto Sans Devanagari',Arial,sans-serif;color:#fff}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.wrap{position:relative;z-index:1;max-width:600px;margin:auto;padding:14px 14px 60px}
.win{background:rgba(10,10,10,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);border-radius:26px;padding:16px;margin:14px 0}
.row{display:flex;gap:8px;align-items:center}
input,select{flex:1;min-width:0;padding:11px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#fff;font-size:1rem;outline:0}
select{flex:0 0 auto;padding:8px 10px}select option{color:#000}
input::placeholder{color:rgba(255,255,255,.45)}
button{padding:10px 18px;border:0;border-radius:20px;background:#fff;color:#000;font-weight:600;font-size:.92rem;cursor:pointer}
.bar2{display:flex;justify-content:space-between;align-items:center;margin:10px 2px}
.brand{letter-spacing:.35em;font-size:.8rem;opacity:.7}
h3{margin:0 0 4px;font-weight:500;font-size:1.02rem}
.sub{opacity:.55;font-size:.85rem}
.aqi{display:flex;align-items:center;gap:14px}
.aqi>b{font-size:2.6rem;font-weight:300;line-height:1}
.bar{height:4px;border-radius:4px;background:linear-gradient(90deg,#2ecc71,#f1c40f,#ff9f1a,#ff4d4d,#b455ff,#c2223d);margin-top:12px;position:relative}
.bar s{position:absolute;top:-4px;width:3px;height:12px;background:#fff;border-radius:2px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.big{font-size:6.2rem;font-weight:200;line-height:.95;letter-spacing:-.03em}
.right{text-align:right;font-size:1.05rem}
.right svg{width:34px;height:34px;vertical-align:middle;margin-right:6px}
.city{opacity:.7;margin:0 0 6px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
.grid div,.kpis div{background:rgba(255,255,255,.05);border-radius:16px;padding:9px 13px;font-size:.92rem}
small{display:block;opacity:.5;font-size:.72rem;letter-spacing:.04em}
.tips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.tips h4{margin:0 0 4px;font-weight:500}.tips ul{margin:0;padding-left:16px;font-size:.88rem;opacity:.9}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.12)}
.tabs button.on{background:#fff;color:#000}
.stk{position:sticky;top:8px;z-index:5;padding:6px;border-radius:24px;background:rgba(10,10,10,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);margin:14px 0}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin-top:12px}
.hr{min-width:60px;text-align:center;font-size:.85rem}
.hr svg,.dy svg{width:30px;height:30px;margin:4px 0}
.dy{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.dy span:first-child{width:70px}.dy span:last-child{margin-left:auto}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.92rem}
td,th{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.08);text-align:center;font-weight:400}
td:first-child{text-align:left;opacity:.55}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kpis b{display:block;font-size:1.15rem;font-weight:400}
.cb{position:relative;margin-top:8px;touch-action:pan-y}
.tip{position:absolute;top:0;left:44px;font-size:.78rem;background:#000;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:5px 8px;pointer-events:none;display:none;white-space:nowrap}
.err{color:#ff8b8b;padding:8px}
.d{animation:fall 1s linear infinite}.bl{animation:fl 2.4s infinite}
@keyframes fall{from{transform:translateY(-3px);opacity:1}to{transform:translateY(8px);opacity:0}}
@keyframes fl{0%,60%,100%{opacity:.25}70%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

:root{--fg:#fff}
.win,.grid div,.kpis div,.tp{cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.up{transform:translateY(-12px) scale(1.03)!important;box-shadow:0 26px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.28);z-index:30;position:relative}
.win,.cb{color:var(--fg)}
#sug{position:absolute;left:14px;right:14px;top:66px;z-index:40;background:rgba(14,14,14,.97);border:1px solid rgba(255,255,255,.14);border-radius:20px;overflow:hidden;display:none}
#sug div{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}#sug small{opacity:.55}
.tbar{height:10px;border-radius:8px;position:relative;margin:12px 0 4px}.tbar i{position:absolute;top:-3px;width:3px;height:16px;background:#fff;border-radius:2px;box-shadow:0 0 5px #000}
canvas.sc{width:100%;height:230px;display:block;border-radius:18px;margin:8px 0}
.mrow{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.tpg{display:grid;gap:10px;margin-top:10px}
.tp{background:rgba(255,255,255,.05);border-radius:18px;padding:12px 14px}
.tp h4{margin:0 0 2px;font-weight:500}.tp ul{margin:2px 0 6px;padding-left:18px;font-size:.88rem}
.g{color:#5be38f}.r{color:#ff8b8b}
#map{height:320px;border-radius:18px;overflow:hidden;margin-top:10px;background:#111}
html:not([data-th=white]) .base{filter:invert(1) hue-rotate(180deg) brightness(.85) saturate(.5)}
[data-th=white],[data-th=white] body{background:#f3f5f8;color:#0f1420;--fg:#0f1420}
[data-th=white] .win,[data-th=white] .stk{background:rgba(255,255,255,.84);border-color:rgba(0,0,0,.08)}
[data-th=white] input,[data-th=white] select{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.12);color:#0f1420}
[data-th=white] input::placeholder{color:rgba(0,0,0,.45)}
[data-th=white] button{background:#0f1420;color:#fff}
[data-th=white] .tabs button{background:rgba(0,0,0,.05);color:#0f1420;border-color:rgba(0,0,0,.1)}
[data-th=white] .tabs button.on{background:#0f1420;color:#fff}
[data-th=white] .grid div,[data-th=white] .kpis div,[data-th=white] .tp{background:rgba(0,0,0,.04)}
[data-th=white] td,[data-th=white] th,[data-th=white] .dy{border-color:rgba(0,0,0,.08)}
[data-th=white] .tip,[data-th=white] #sug{background:#fff;color:#0f1420;border-color:rgba(0,0,0,.15)}
[data-th=white] .g{color:#119953}[data-th=white] .r{color:#d63a3a}
[data-th=white] .up{box-shadow:0 22px 50px rgba(0,0,0,.22)}

*{-webkit-tap-highlight-color:transparent}
body{touch-action:manipulation}
button,select,input,.win,.grid div,.kpis div,.tp,.cb,canvas,svg{outline:0}
button:focus,select:focus{outline:0}
.win,.grid div,.kpis div,.tp,.tabs button,.ic2,.brand{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
::selection{background:rgba(150,150,150,.35)}
#thw{position:relative}
.ic2{width:40px;height:40px;padding:0;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center}
.ic2 svg{width:22px;height:22px;display:block}
.ic2.on{background:#fff;color:#000}
#thp{position:absolute;right:0;top:48px;z-index:60;display:none;gap:8px;padding:8px;border-radius:999px;background:rgba(14,14,14,.96);border:1px solid rgba(255,255,255,.16);box-shadow:0 14px 40px rgba(0,0,0,.5)}
#thp.open{display:flex}
[data-th=white] .ic2{background:rgba(0,0,0,.06);color:#0f1420;border-color:rgba(0,0,0,.15)}
[data-th=white] .ic2.on{background:#0f1420;color:#fff}
[data-th=white] #thp{background:#fff;border-color:rgba(0,0,0,.14);box-shadow:0 14px 40px rgba(0,0,0,.18)}
.vz{position:relative;overflow:hidden}
.vzc{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none}
.vzi{position:relative;z-index:1}

/* ===== v4 ===== */
.tools{margin:4px 2px 0;gap:8px;flex-wrap:wrap}
.seg2{display:inline-flex;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);padding:3px}
.seg2 button{padding:7px 12px;background:transparent;color:inherit;border-radius:999px;font-size:.78rem;font-weight:600}
.seg2 button.on{background:#fff;color:#000}
#bell{margin-left:auto}
.favs{display:none;gap:8px;overflow-x:auto;padding:10px 2px 2px}
.chip{flex:none;display:inline-flex;align-items:center;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);font-size:.82rem;font-weight:500}
.chip.on{background:#fff;color:#000}
.chip button{padding:0;background:transparent;color:inherit;border-radius:0;font-size:.82rem;font-weight:500}
.chip .cx{margin-left:9px;opacity:.55;font-size:1rem;line-height:1}
.ic3{width:34px;height:34px;padding:0;border-radius:50%;background:rgba(255,255,255,.08);color:inherit;border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;font-size:16px;line-height:1}
.ic3 svg{width:17px;height:17px;display:block}
.ic3.on{color:#ffc83d}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#sug2{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:rgba(14,14,14,.97);border:1px solid rgba(255,255,255,.14);border-radius:20px;overflow:hidden;display:none}
#sug2 div{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}#sug2 small{opacity:.55}
#cmpW{position:relative;z-index:20}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:#000;color:#fff;padding:11px 18px;border-radius:999px;font-size:.88rem;z-index:100;transition:.3s;pointer-events:none;max-width:90vw;text-align:center;border:1px solid rgba(255,255,255,.2)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ncr{display:flex;gap:12px;align-items:center}.nci{font-size:2rem}.ncr b{font-size:1.05rem;font-weight:500}
.ncb{display:flex;align-items:flex-end;gap:2px;height:44px;margin-top:12px}
.ncb i{flex:1;display:block;background:rgba(255,255,255,.12);border-radius:2px}.ncb i.w{background:#4da3ff}
.ncl{display:flex;justify-content:space-between;font-size:.7rem;opacity:.55;margin-top:4px}
.als{margin-top:10px}.okw{margin-top:10px}
.al{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:18px;margin-top:8px;border:1px solid}
.al.lv1{background:rgba(255,170,40,.14);border-color:rgba(255,170,40,.45)}
.al.lv2{background:rgba(255,70,70,.16);border-color:rgba(255,70,70,.5)}
.al .ai{font-size:1.5rem;line-height:1.1}.al b{font-weight:600}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.gc{text-align:center;min-width:0}.gc svg{width:100%;max-width:170px;height:auto;display:block;margin:0 auto}
.gv{font-size:1.7rem;font-weight:300;margin-top:2px}.gv span{font-size:.85rem;opacity:.6}
.arw,.ndl{transition:transform 1.3s cubic-bezier(.2,.9,.2,1)}
.wob{animation:wob 2.6s ease-in-out infinite;transform-origin:80px 80px}
@keyframes wob{0%,100%{transform:rotate(calc(var(--wa) * -1))}50%{transform:rotate(var(--wa))}}
#pendC{width:100%;height:270px;display:block}
.ck{text-align:center;font-size:2.8rem;font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1.1;cursor:pointer}
.ck #ckS{color:#dcf56e}
.ck small{display:inline;font-size:1rem;opacity:.7;margin-left:8px;letter-spacing:.1em}
.ck .co{animation:blink 1s steps(2,start) infinite;opacity:.6}
@keyframes blink{50%{opacity:.15}}
[data-th=white] .ck #ckS{color:#3b7400}
[data-th=white] #toast{background:#0f1420}
[data-th=white] #sug2{background:#fff;color:#0f1420;border-color:rgba(0,0,0,.15)}
[data-th=white] .ic3{background:rgba(0,0,0,.06);color:#0f1420;border-color:rgba(0,0,0,.14)}
[data-th=white] .ic3.on{color:#d49200}
[data-th=white] .seg2{border-color:rgba(0,0,0,.15);background:rgba(0,0,0,.04)}
[data-th=white] .seg2 button{background:transparent;color:#0f1420}
[data-th=white] .seg2 button.on{background:#0f1420;color:#fff}
[data-th=white] .chip{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.12)}
[data-th=white] .chip.on{background:#0f1420;color:#fff}
[data-th=white] .chip button{background:transparent;color:inherit}
[data-th=white] .ncb i{background:rgba(0,0,0,.1)}[data-th=white] .ncb i.w{background:#2f6fe0}

/* ===== v5 ===== */
#dw{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,0);-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0);transition:background .3s,backdrop-filter .3s,-webkit-backdrop-filter .3s;-webkit-tap-highlight-color:transparent}
#dw.on{background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.dwc{width:100%;max-width:440px;max-height:86vh;overflow:hidden;background:rgba(18,18,20,.97);border:1px solid rgba(255,255,255,.2);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.7);color:#fff;position:relative;transform-origin:center;will-change:transform,opacity}
.dws{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.dws::-webkit-scrollbar{display:none}
.dsl{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;padding:20px 20px 16px;max-height:calc(86vh - 44px);overflow-y:auto;box-sizing:border-box}
.dnav{display:flex;align-items:center;justify-content:center;gap:14px;padding:0 0 14px}
.dnav button{width:30px;height:30px;padding:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font-size:1rem;line-height:1}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25);transition:.2s}.dots i.on{background:#fff;width:18px;border-radius:5px}
.dh{display:flex;align-items:center;gap:12px}.dh .e{font-size:2rem;line-height:1}.dh h4{margin:0;font-weight:500;font-size:1.1rem}
.dbig{font-size:3.2rem;font-weight:200;line-height:1.05;margin:10px 0 2px}.dbig small{display:inline!important;font-size:1rem;opacity:.6;margin-left:6px;white-space:nowrap}
.dlv{display:inline-block;padding:3px 12px;border-radius:999px;font-size:.82rem;font-weight:600;color:#000;margin:4px 0 8px}
.dm{height:10px;border-radius:6px;position:relative;margin:10px 0 4px}.dm i{position:absolute;top:-4px;width:4px;height:18px;background:#fff;border-radius:2px;box-shadow:0 0 6px #000;transform:translateX(-50%)}
.dmt{display:flex;justify-content:space-between;font-size:.7rem;opacity:.5}
.dp{font-size:.9rem;opacity:.82;line-height:1.5;margin:10px 0}
.dst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.dst div{background:rgba(255,255,255,.07);border-radius:14px;padding:8px 6px;text-align:center}.dst small{display:block;opacity:.55;font-size:.7rem}.dst b{font-weight:500;font-size:.95rem}
.dsp{width:100%;height:auto;display:block;margin:6px 0}
.dcb{position:relative;margin-top:6px}
.dhr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.dhr div{background:rgba(255,255,255,.06);border-radius:12px;padding:6px 2px;text-align:center;font-size:.78rem}.dhr svg{width:26px;height:26px}
.dl{margin:8px 0 0;padding:0;list-style:none;font-size:.92rem}.dl li{padding:6px 0 6px 26px;position:relative;line-height:1.4}
.dl.g li:before{content:"✔";position:absolute;left:2px;color:#3ddc84}.dl.r li:before{content:"✖";position:absolute;left:2px;color:#ff6b6b}
.dtt{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-top:12px}
.ctg{position:absolute;top:0;right:0;z-index:3;display:inline-flex;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.45);padding:2px}
.ctg button{padding:4px 10px;background:transparent;color:inherit;border-radius:999px;font-size:.72rem;font-weight:600}
.ctg button.on{background:#fff;color:#000}
.tpg2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tp2{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:168px;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;-webkit-user-select:none;user-select:none}
.tp2 .th{display:flex;align-items:center;gap:8px;font-weight:500;font-size:.95rem}.tp2 .th span{font-size:1.4rem}
.tp2 .vz2{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.tp2 .ring{position:relative;width:74px;height:74px}.ring svg{width:74px;height:74px;transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.25rem;font-weight:500}
.tp2 .cap{font-size:.74rem;opacity:.65}
.tp2 .ln{font-size:.76rem;opacity:.85;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:center}
.segs{display:flex;gap:4px;width:100%;margin:6px 0}.segs i{flex:1;height:14px;border-radius:5px;background:rgba(255,255,255,.12)}
.mbar{width:100%;height:10px;border-radius:6px;position:relative;margin:10px 0 4px}.mbar i{position:absolute;top:-4px;width:4px;height:18px;background:#fff;border-radius:2px;box-shadow:0 0 5px #000;transform:translateX(-50%)}
.drops{font-size:1.1rem;letter-spacing:2px}
.nrh{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}
.nrh div{text-align:center;font-size:.72rem}.nrh .bb{height:38px;border-radius:6px;background:rgba(255,255,255,.1);position:relative;overflow:hidden;margin:3px 0}.nrh .bb i{position:absolute;left:0;right:0;bottom:0;background:#4da3ff}
.nrt{font-size:.74rem;opacity:.6;margin-top:10px}
#clkW{background:#000!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;color:#fff;border-color:rgba(255,255,255,.14)!important}
#clkW .sub{color:#fff}
#clkW .ck #ckS{color:#19f060}
[data-th=white] #dw.on{background:rgba(20,30,50,.45)}
[data-th=white] .dwc{background:rgba(255,255,255,.98);color:#0f1420;border-color:rgba(0,0,0,.12)}
[data-th=white] .dst div,[data-th=white] .dhr div{background:rgba(0,0,0,.05)}
[data-th=white] .dnav button{background:rgba(0,0,0,.08);color:#0f1420}[data-th=white] .dots i{background:rgba(0,0,0,.2)}[data-th=white] .dots i.on{background:#0f1420}
[data-th=white] .tp2{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.1)}[data-th=white] .segs i{background:rgba(0,0,0,.12)}
[data-th=white] .ctg{background:rgba(255,255,255,.7);border-color:rgba(0,0,0,.2)}[data-th=white] .ctg button.on{background:#0f1420;color:#fff}
[data-th=white] .nrh .bb{background:rgba(0,0,0,.08)}
[data-th=white] #clkW .ck,[data-th=white] #clkW h3{color:#fff}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="win row" style="margin-top:0"><input id="q" data-p="ph" autocomplete="off"><button id="geo">📍</button><button id="go" data-i="go"></button></div>
  <div id="sug"></div>
  <div class="bar2"><span class="brand">WEATHER∞</span><div class="row"><div id="thw"><button id="thb" class="ic2"></button><div id="thp"></div></div><select id="lang"><option value="en">English</option><option value="hi">हिन्दी</option></select></div></div>

    ser = S.lo ? [{ d: S.hi.map(cT), cf: tcU, n: t('hi') }, { d: S.lo.map(cT), cf: tcU, n: t('lo') }] : [{ d: S.hi.map(cT), cf: tcU, n: t('temp') }]; typ = 'band'; u2 = '°'; m0 = 3;
  } else if (idx === 3 || idx === 4) {
    const a = idx === 3 ? S.rain : S.snow, tot = sm(a), thr = idx === 3 ? (n === 1 ? .1 : 1) : (n === 1 ? .05 : .5), wd = a.filter(x => x > thr).length, im = argmax(a), u = idx === 3 ? ' mm' : ' cm';
    title = idx === 3 ? t('ktr') : t('kts'); ic = idx === 3 ? '🌧️' : '❄️'; big = tot.toFixed(1); un = u.trim(); col = idx === 3 ? '#2f8bff' : '#8fc4ff';
    body = `<div class="dst">${g(t('total'), tot.toFixed(1) + u)}${g(t('wet'), a[im] > 0 ? a[im].toFixed(1) + u : '-')}${g(t('perDay'), (tot / (n === 1 ? 1 : a.length)).toFixed(1) + u)}</div><div class="sub">${a[im] > 0 ? t('when') + ': ' + lb[im] + ' · ' : ''}${wd} ${n === 1 ? t('rdh') : t('rdd')}</div>`;
    ser = [{ d: a, c: col }]; typ = 'bar'; u2 = u; m0 = n === 1 ? 1 : 5;
  } else {
    const mxw = Math.max(...S.wind), im = argmax(S.wind), av = sm(S.wind) / S.wind.length;
    title = t('kw'); ic = '💨'; big = fnum(cS(mxw)); un = uS(); col = '#2fd6a8';
    body = `<div class="dst">${g(t('mx'), Math.round(cS(mxw)) + ' ' + uS())}${g(t('av'), Math.round(cS(av)) + ' ' + uS())}${g(t('when'), lb[im])}</div>`;
    ser = [{ d: S.wind.map(cS), c: col }]; typ = 'band'; u2 = ' ' + uS(); m0 = 6;
  }
  openDW(el, [`<div class="dh"><span class="e">${ic}</span><div><h4>${title}</h4><div class="sub">${per}</div></div></div><div class="dbig" style="color:${col}">${big}<small>${un}</small></div>${body}<div class="dcb" id="dwch"></div><div class="sub" style="text-align:center;margin-top:8px">${t('close')}</div>`]);
  chart0($('dwch'), lb, ser, typ, u2, m0);
}

/* ---------- dashboard: Line / Bar switch on every chart card ---------- */
let DS = null; const DEFT = { c1: 'band', c2: 'bar', c3: 'band', c4: 'bar', c5: 'band' }, CHA = {}; let DTOG = {}; try { DTOG = JSON.parse(localStorage.getItem('ct')) || {}; } catch (e) { }
const chart0 = chart;
chart = function (box, lb, ser, type, u, m0) { const id = box && box.id; if (DEFT[id]) { CHA[id] = [lb, ser, type, u, m0]; if (DTOG[id]) type = DTOG[id]; } return chart0(box, lb, ser, type, u, m0); };
function dashTog() {
  Object.keys(DEFT).forEach(id => {
    const box = $(id); if (!box) return; const card = box.closest('.vzi'); if (!card || card.querySelector('.ctg')) return; const cur = DTOG[id] || DEFT[id];
    const g = document.createElement('div'); g.className = 'ctg'; g.innerHTML = `<button data-t="band" class="${cur === 'band' ? 'on' : ''}">${t('line')}</button><button data-t="bar" class="${cur === 'bar' ? 'on' : ''}">${t('bar')}</button>`;
    g.onclick = e => { const b = e.target.closest('button'); if (!b) return; DTOG[id] = b.dataset.t; try { localStorage.setItem('ct', JSON.stringify(DTOG)); } catch (x) { } g.querySelectorAll('button').forEach(q => q.classList.toggle('on', q === b)); chart($(id), ...CHA[id]); };
    card.appendChild(g);
  });
}

/* ---------- rain card: show something useful when no rain is coming ---------- */
function nowViz(nc, mx) {
  if (nc.vals.some(v => v >= .1)) return `<div class="ncb">${nc.vals.map(v => `<i class="${v >= .1 ? 'w' : ''}" style="height:${Math.max(7, v / mx * 100)}%"></i>`).join('')}</div><div class="ncl"><span>${t('now')}</span><span>+3 ${t('hh')}</span><span>+6 ${t('hh')}</span></div>`;
  const w = W.w, i = Math.max(hourNow(w), 0), h = w.hourly;
  return `<div class="nrt">${t('rch')}</div><div class="nrh">${Array.from({ length: 6 }, (_, j) => { const q = i + j, p = h.precipitation_probability[q] || 0; return `<div><span>${j ? hourLabel(h.time[q]) : t('now')}</span><div class="bb"><i style="height:${Math.max(4, p)}%"></i></div><b>${p}%</b></div>`; }).join('')}</div>`;
}

/* ---------- life tips as visual tiles ---------- */
let TIPD = [];
function ringHTML(score, col) { const C = 2 * Math.PI * 30; return `<div class="ring"><svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="30" fill="none" stroke="currentColor" stroke-opacity=".12" stroke-width="7"/><circle cx="36" cy="36" r="30" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(C * score / 100).toFixed(1)} ${C.toFixed(1)}"/></svg><b>${Math.round(score)}</b></div>`; }
function tipsUI(S, det, ic, li, o) {
  const { tp, fl, hu, wi, gu, uv, vis, aqi, day, k, sn, wet, w, d } = o, cl = x => clamp(Math.round(x), 0, 100), scol = x => x >= 70 ? '#3ddc84' : x >= 45 ? '#ff9f1a' : '#ff4d4d', slab = x => x >= 70 ? t('fine') : x >= 45 ? t('fair') : t('poor');
  const out = cl(100 - Math.min(60, Math.abs(fl - 22) * 2.2) - (wet ? 25 : 0) - (aqi > 100 ? Math.min(40, (aqi - 100) / 4) : 0) - (wi > 30 ? Math.min(20, wi - 30) : 0) - (k === 'storm' ? 40 : 0));
  const road = cl(100 - (vis < 1 ? 55 : vis < 4 ? 30 : vis < 10 ? 10 : 0) - (wet ? 20 : 0) - (k === 'storm' ? 25 : 0) - (sn || tp <= 0 ? 35 : 0) - (gu >= 45 ? 15 : 0));
  const com = cl(100 - Math.abs(fl - 22) * 2 - (hu > 85 ? 15 : 0) - (hu < 25 ? 10 : 0) - (aqi > 150 ? 15 : 0));
  const home = cl(100 - (k === 'storm' ? 50 : 0) - (wi >= 30 || gu >= 45 ? 25 : 0) - (wet ? 15 : 0) - (tp >= 38 || tp <= 5 ? 15 : 0));
  const nj = hrIdx(w, d, 22), nt = nj >= 0 && !day ? tp : (nj >= 0 ? w.hourly.temperature_2m[nj] : tp), slp = cl(100 - Math.abs(nt - 22) * 3.2 - (hu > 85 ? 10 : 0));
  const wl = fl >= 35 ? 0 : fl >= 25 ? 1 : fl >= 15 ? 2 : fl >= 5 ? 3 : 4, litres = tp >= 38 ? 4.5 : tp >= 32 ? 4 : tp >= 26 ? 3.2 : tp <= 10 ? 2.2 : 2.7, ui = uv < 3 ? 0 : uv < 6 ? 1 : uv < 8 ? 2 : uv < 11 ? 3 : 4, ai = aqiInfo(aqi);
  const wcol = ['#3fd0e0', '#3ddc84', '#f1d84a', '#ff9f1a', '#ff4d4d'][wl], ucol = UVB[ui][2];
  const ringV = (sc, cap) => ({ big: ringHTML(sc, scol(sc)), cap: `${cap} · ${slab(sc)}`, col: scol(sc), val: sc, sh: slab(sc), capn: cap });
  const vz = [
    { big: `<div class="segs">${[0, 1, 2, 3, 4].map(j => `<i style="${j <= wl ? 'background:' + wcol : ''}"></i>`).join('')}</div>`, cap: t('sWarm') + ' · ' + t('wl')[wl], col: wcol, val: t('wl')[wl], capn: t('sWarm') },
    ringV(out, t('sOut')), ringV(road, t('sRoad')), ringV(com, t('sCom')),
    { big: `<div class="mbar" style="background:linear-gradient(90deg,${UVB.map(([a, b, c], j) => c + ' ' + (a / 12 * 100) + '%').join(',')})"><i style="left:${clamp(uv, 0, 12) / 12 * 100}%"></i></div><b style="font-size:1.25rem;font-weight:500;color:${ucol}">${uv.toFixed(1)}</b>`, cap: t('sUV') + ' · ' + t('uvl')[ui], col: ucol, val: uv.toFixed(1), capn: t('sUV') },
    { big: `<div class="drops">${'💧'.repeat(Math.round(litres))}</div><b style="font-size:1.25rem;font-weight:500">≈ ${litres} L</b>`, cap: t('sH2O'), col: '#4da3ff', val: litres + ' L', capn: t('sH2O') },
    { big: aqi ? `<div class="mbar" style="background:linear-gradient(90deg,#2ecc71 0%,#f1c40f 20%,#ff9f1a 35%,#ff4d4d 50%,#b455ff 70%,#c2223d 100%)"><i style="left:${clamp(aqi, 0, 500) / 5}%"></i></div><b style="font-size:1.25rem;font-weight:500;color:${ai[0]}">${aqi}</b>` : '<b>-</b>', cap: t('sAir') + (aqi ? ' · ' + ai[1] : ''), col: ai[0], val: aqi || '-', capn: t('sAir') },
    ringV(home, t('sHome')), ringV(slp, t('sSlp'))
  ];
  TIPD = S.map((x, j) => ({ ic: ic[j], ti: t('tt')[j], det: det[j], y: x.y, n: x.n, li, v: vz[j], first: x.y[0] || x.n[0] || '' }));
  const grid = TIPD.map((q, j) => `<div class="tp2" data-j="${j}"><div class="th"><span>${q.ic}</span>${q.ti}</div><div class="vz2">${q.v.big}<div class="cap">${q.v.cap}</div></div><div class="ln">${q.y.length ? q.y[0] : q.first}</div></div>`).join('');
  $('tips').insertAdjacentHTML('beforeend', `<div class="tpg2">${grid}</div>`);
}
function tipDW(el) {
  const j = +el.dataset.j; if (!TIPD.length || isNaN(j)) return;
  const sl = TIPD.map(q => `<div class="dh"><span class="e">${q.ic}</span><div><h4>${q.ti}</h4><div class="sub">${q.v.capn}</div></div></div><div class="dbig" style="color:${q.v.col}">${q.v.val}</div><div class="sub">${q.det}</div>
    <div class="dtt" style="color:#3ddc84;opacity:1">${t('yes')}</div><ul class="dl g">${q.li(q.y)}</ul><div class="dtt" style="color:#ff6b6b;opacity:1">${t('no')}</div><ul class="dl r">${q.li(q.n)}</ul>`);
  openDW(el, sl, j);
}

/* ---------- label every hero tile so the window knows which one it is ---------- */
const _extras = extras; extras = function () { _extras(); if ($('dash') && $('dash').querySelector('.ctg') === null && DS) dashTog(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) closeDW(true); });
let saved = null;
try { saved = JSON.parse(localStorage.getItem('place')); L = localStorage.getItem('lang') || 'en'; } catch (e) { }
$('lang').value = L; applyLang(); load(saved || 'Delhi');
</script>
</body>
