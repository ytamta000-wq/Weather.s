<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dotcast Weather</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0a0a0a;--fg:#fff;--panel:rgba(10,10,10,.62);--panelBorder:rgba(255,255,255,.1);--inputBg:rgba(255,255,255,.05);--inputBorder:rgba(255,255,255,.14);--muted:rgba(255,255,255,.55);--chip:rgba(255,255,255,.05);--stk:rgba(10,10,10,.75);--btnBg:#fff;--btnFg:#000}
body.light{--bg:#f2f3f5;--fg:#111;--panel:rgba(255,255,255,.72);--panelBorder:rgba(0,0,0,.1);--inputBg:rgba(0,0,0,.04);--inputBorder:rgba(0,0,0,.14);--muted:rgba(0,0,0,.55);--chip:rgba(0,0,0,.045);--stk:rgba(255,255,255,.78);--btnBg:#111;--btnFg:#fff}
body.nature{--bg:#bfe3f2;--fg:#1c3324;--panel:rgba(255,255,255,.55);--panelBorder:rgba(20,60,40,.18);--inputBg:rgba(255,255,255,.5);--inputBorder:rgba(20,60,40,.22);--muted:rgba(20,50,35,.65);--chip:rgba(255,255,255,.4);--stk:rgba(255,255,255,.7);--btnBg:#1c5c3a;--btnFg:#fff}
.tilefx{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:26px;opacity:.5}
.rainfx span{position:absolute;top:-14%;width:2px;height:16%;background:linear-gradient(to bottom,rgba(110,180,255,0),rgba(110,180,255,1));animation:tilerain linear infinite}
@keyframes tilerain{0%{transform:translateY(-14%)}100%{transform:translateY(700%)}}
.windfx span{position:absolute;left:-15%;height:2.5px;width:20%;background:linear-gradient(to right,rgba(255,255,255,0),rgba(255,255,255,.9));border-radius:2px;animation:tilewind linear infinite}
@keyframes tilewind{0%{transform:translateX(-15%)}100%{transform:translateX(600%)}}
.snowfx span{position:absolute;top:-10%;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.9);animation:tilesnow linear infinite}
@keyframes tilesnow{0%{transform:translateY(-10%) translateX(0)}100%{transform:translateY(420%) translateX(12px)}}
.irbar{height:10px;border-radius:6px;margin:10px 0 2px;background:linear-gradient(90deg,#2a6fe0,#37c2c2,#59d17a,#e8d34a,#f08a3c,#e0453c);position:relative}
.irbar b{position:absolute;top:-15px;transform:translateX(-50%);font-size:.72rem;font-weight:400}
.irbar b::after{content:'';position:absolute;left:50%;top:17px;width:2px;height:8px;background:currentColor;transform:translateX(-1px)}
html,body{margin:0;background:var(--bg)}
body{font-family:"Helvetica Neue",system-ui,'Noto Sans Devanagari',Arial,sans-serif;color:var(--fg);transition:background .3s,color .3s}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.wrap{position:relative;z-index:1;max-width:600px;margin:auto;padding:14px 14px 60px}
.win{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--panelBorder);border-radius:26px;padding:16px;margin:14px 0;position:relative;overflow:hidden}
.row{display:flex;gap:8px;align-items:center}
input,select{flex:1;min-width:0;padding:11px 16px;border-radius:20px;border:1px solid var(--inputBorder);background:var(--inputBg);color:var(--fg);font-size:1rem;outline:0}
select{flex:0 0 auto;padding:8px 10px}select option{color:#000}
input::placeholder{color:var(--muted)}
button{padding:10px 18px;border:0;border-radius:20px;background:var(--btnBg);color:var(--btnFg);font-weight:600;font-size:.92rem;cursor:pointer}
.icb{flex:0 0 auto;width:42px;height:42px;padding:0;border-radius:50%;background:var(--inputBg);color:var(--fg);border:1px solid var(--inputBorder);display:flex;align-items:center;justify-content:center;font-size:1.05rem}
.bar2{display:flex;justify-content:space-between;align-items:center;margin:10px 2px;gap:8px}
.brand{letter-spacing:.16em;font-size:.8rem;opacity:.85;display:inline-flex;align-items:center;gap:6px}
.wemo{font-size:1.15rem;display:inline-block;line-height:1}
.wemo.k-sun{animation:spin 12s linear infinite}
.wemo.k-moon{animation:moonglow 3.6s ease-in-out infinite}
.wemo.k-partly,.wemo.k-cloud{animation:drift 3.4s ease-in-out infinite}
.wemo.k-rain,.wemo.k-storm{animation:drop 1s ease-in infinite}
.wemo.k-hail{animation:drop .6s ease-in infinite}
.wemo.k-snow{animation:sway 2.4s ease-in-out infinite}
.wemo.k-fog{animation:fadepulse 3s ease-in-out infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes moonglow{0%,100%{opacity:.75;filter:drop-shadow(0 0 0 rgba(210,220,255,0))}50%{opacity:1;filter:drop-shadow(0 0 5px rgba(210,220,255,.7))}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@keyframes drop{0%{transform:translateY(-2px)}60%{transform:translateY(2px)}100%{transform:translateY(-2px)}}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes fadepulse{0%,100%{opacity:.5}50%{opacity:1}}
.bar2r{display:flex;gap:6px;align-items:center}
h3{margin:0 0 4px;font-weight:500;font-size:1.02rem}
.sub{opacity:.55;font-size:.85rem}
.aqi{display:flex;align-items:center;gap:14px}
.aqi>b{font-size:2.6rem;font-weight:300;line-height:1}
.bar{height:4px;border-radius:4px;background:linear-gradient(90deg,#2ecc71,#f1c40f,#ff9f1a,#ff4d4d,#b455ff,#c2223d);margin-top:12px;position:relative}
.bar s{position:absolute;top:-4px;width:3px;height:12px;background:var(--fg);border-radius:2px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.big{font-size:6.2rem;font-weight:200;line-height:.95;letter-spacing:-.03em}
.right{text-align:right;font-size:1.05rem}
.right svg{width:34px;height:34px;vertical-align:middle;margin-right:6px}
.city{opacity:.7;margin:0 0 6px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
.grid div,.kpis div{background:var(--chip);border-radius:16px;padding:9px 13px;font-size:.92rem}
.wdir{display:inline-block;vertical-align:middle;margin-left:6px}
small{display:block;opacity:.5;font-size:.72rem;letter-spacing:.04em}
.tips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.tips h4{margin:0 0 4px;font-weight:500}.tips ul{margin:0;padding-left:16px;font-size:.88rem;opacity:.9}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;background:var(--inputBg);color:var(--fg);border:1px solid var(--inputBorder)}
.tabs button.on{background:var(--btnBg);color:var(--btnFg)}
.stk{position:sticky;top:8px;z-index:5;padding:6px;border-radius:24px;background:var(--stk);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--panelBorder);margin:14px 0}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin-top:12px}
.hr{min-width:60px;text-align:center;font-size:.85rem}
.hr svg,.dy svg{width:30px;height:30px;margin:4px 0}
.dy{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--panelBorder)}
.dy span:first-child{width:70px}.dy span:last-child{margin-left:auto}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.92rem}
td,th{padding:7px 4px;border-bottom:1px solid var(--panelBorder);text-align:center;font-weight:400}
td:first-child{text-align:left;opacity:.55}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kpis b{display:block;font-size:1.15rem;font-weight:400}
.cb{position:relative;margin-top:8px;touch-action:pan-y}
.tip{position:absolute;top:0;left:44px;font-size:.78rem;background:#000;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:5px 8px;pointer-events:none;display:none;white-space:nowrap}
.err{color:#ff8b8b;padding:8px}
.d{animation:fall 1s linear infinite}.bl{animation:fl 2.4s infinite}
@keyframes fall{from{transform:translateY(-3px);opacity:1}to{transform:translateY(8px);opacity:0}}
@keyframes fl{0%,60%,100%{opacity:.25}70%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<style>#radarMap{height:320px;border-radius:18px;z-index:1}#radarMap .leaflet-control-attribution{font-size:9px}</style>

<canvas id="fx"></canvas>
<div class="wrap">
  <div class="win row" style="margin-top:0"><input id="q" data-p="ph" autocomplete="off"><button class="icb" id="loc" title="Use my location">📍</button><button id="go" data-i="go"></button></div>

    <section class="win" id="aqi"></section>
    <section class="win" id="hero"></section>
    <section class="win" id="tips"></section>
    <section class="win"><h3 data-i="radar"></h3><div class="sub" data-i="radarSub"></div><div id="radarMap"></div><div class="sub" style="margin-top:6px;font-size:.72rem">Radar: RainViewer.com · Map: © OpenStreetMap contributors</div></section>
    <section class="win">
      <div class="tabs" id="ftabs"><button class="on" data-v="hourly" data-i="hourly"></button><button data-v="daily" data-i="week"></button></div>
      <div class="strip" id="hourly"></div><div id="daily" hidden style="margin-top:10px"></div>
    </section>
    <section class="win">
      <h3 data-i="cmp"></h3>
      <div class="row"><input id="q2" data-p="cph"><button id="cmpb" data-i="cbtn"></button></div>
      <div id="cmpOut"></div>
    </section>
    <h3 style="margin:22px 4px 0" data-i="dash"></h3>
    <div class="tabs stk" id="dtabs"><button class="on" data-n="1" data-i="r1"></button><button data-n="7" data-i="r7"></button><button data-n="30" data-i="r30"></button><button data-n="90" data-i="r90"></button></div>
    <div id="dash"></div>
  </main>
</div>

const summ = o => { const w = o.w, c = w.current, d = todayIdx(w); return { tp: c.temperature_2m, fl: c.apparent_temperature, hu: c.relative_humidity_2m, wi: c.wind_speed_10m, ra: w.daily.precipitation_probability_max[d], uv: w.daily.uv_index_max[d], aq: o.q && o.q.current ? o.q.current.us_aqi : null }; };
async function compare() {

  try {

    const cell = (v, col, u) => `<td style="color:${col || 'inherit'}">${v == null ? '-' : v + (u || '')}</td>`, ac = v => v == null ? '' : aqiInfo(v)[0];
    $('cmpOut').innerHTML = `<table><tr><th></th><th>${place.name.split(',')[0]}</th><th>${p.name.split(',')[0]}</th></tr>
      <tr><td>${t('temp')}</td>${cell(r(a.tp), tc(a.tp), '°')}${cell(r(b.tp), tc(b.tp), '°')}</tr><tr><td>${t('feels')}</td>${cell(r(a.fl), tc(a.fl), '°')}${cell(r(b.fl), tc(b.fl), '°')}</tr>

      <tr><td>${t('pop')}</td>${cell(a.ra, '', '%')}${cell(b.ra, '', '%')}</tr><tr><td>${t('uv')}</td>${cell(a.uv)}${cell(b.uv)}</tr><tr><td>AQI</td>${cell(a.aq, ac(a.aq))}${cell(b.aq, ac(b.aq))}</tr></table>`;

/* ---------- dashboard ---------- */
async function series(n) {
  const base = `latitude=${place.lat}&longitude=${place.lon}&timezone=auto`, key = W.w.current.time.slice(0, 13);
  if (n === 1) {
    const f = await getJSON(`https://api.open-meteo.com/v1/forecast?${base}&hourly=temperature_2m,precipitation,wind_speed_10m,wind_direction_10m,wind_gusts_10m,snowfall,weather_code,pressure_msl&past_days=1&forecast_days=1`);
    const i = f.hourly.time.findIndex(x => x.startsWith(key)), sl = a => a.slice(i - 23, i + 1);
    return { lb: sl(f.hourly.time).map(x => x.slice(11, 16)), hi: sl(f.hourly.temperature_2m), lo: null, rain: sl(f.hourly.precipitation), wind: sl(f.hourly.wind_speed_10m), gust: sl(f.hourly.wind_gusts_10m), dir: sl(f.hourly.wind_direction_10m), snow: sl(f.hourly.snowfall), code: sl(f.hourly.weather_code), press: sl(f.hourly.pressure_msl) };
  }
  const f = await getJSON(`https://api.open-meteo.com/v1/forecast?${base}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,snowfall_sum,weather_code&hourly=pressure_msl&past_days=${n}&forecast_days=1`);
  const step = Math.max(1, Math.round(f.hourly.pressure_msl.length / f.daily.time.length));
  const pressByDay = f.daily.time.map((_, di) => f.hourly.pressure_msl[Math.min(f.hourly.pressure_msl.length - 1, di * step)]);
  return { lb: f.daily.time.map(x => x.slice(5)), hi: f.daily.temperature_2m_max, lo: f.daily.temperature_2m_min, rain: f.daily.precipitation_sum, wind: f.daily.wind_speed_10m_max, gust: f.daily.wind_gusts_10m_max, dir: f.daily.wind_direction_10m_dominant, snow: f.daily.snowfall_sum, code: f.daily.weather_code, press: pressByDay };
}
function smoothPath(pts) {
  if (pts.length < 3) return pts.length ? 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L') : '';
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += `C${c1x.toFixed(1)},${c1y.toFixed(1)},${c2x.toFixed(1)},${c2y.toFixed(1)},${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
function chart(box, lb, ser, type, u, opts) {
  opts = opts || {};
  const Wd = 640, H = 230, Lm = 44, R = 10, Tm = 12, B = 26, N = lb.length, IW = Wd - Lm - R;
  const all = ser.flatMap(s => s.d).filter(v => v != null); let mn = Math.min(...all), mx = Math.max(...all);
  if (type === 'bar') mn = Math.min(0, mn); if (mx === mn) mx = mn + 1; const pd = (mx - mn) * .08; if (type !== 'bar') mn -= pd; mx += pd;
  const X = i => Lm + (type === 'bar' ? (i + .5) * IW / N : i * IW / Math.max(1, N - 1)), Y = v => Tm + (1 - (v - mn) / (mx - mn)) * (H - Tm - B);
  let defs = '', fillAttr = 'currentColor';
  if (opts.colorByValue) {
    const gid = 'g_' + box.id, dat = ser[0].d;
    const stops = dat.map((v, i) => v == null ? '' : `<stop offset="${(i / Math.max(1, N - 1) * 100).toFixed(1)}%" stop-color="${tc(v)}"/>`).join('');
    defs = `<defs><linearGradient id="${gid}" x1="0" x2="1" y1="0" y2="0">${stops}</linearGradient></defs>`;
    fillAttr = `url(#${gid})`;
  }
  let s = `<svg viewBox="0 0 ${Wd} ${H}" width="100%">${defs}`;
  for (let j = 0; j <= 4; j++) { const v = mn + (mx - mn) * j / 4, y = Y(v); s += `<line x1="${Lm}" x2="${Wd - R}" y1="${y}" y2="${y}" stroke="currentColor" stroke-opacity=".1"/><text x="${Lm - 6}" y="${y + 4}" fill="currentColor" fill-opacity=".6" font-size="11" text-anchor="end">${Math.round(v)}</text>`; }
  for (let j = 0; j < 5; j++) { const i = Math.round(j * (N - 1) / 4); s += `<text x="${X(i)}" y="${H - 6}" fill="currentColor" fill-opacity=".6" font-size="11" text-anchor="middle">${lb[i]}</text>`; }
  const pts = d => d.map((v, i) => v == null ? null : X(i).toFixed(1) + ',' + Y(v).toFixed(1)).filter(Boolean);
  const numPts = d => d.map((v, i) => v == null ? null : [X(i), Y(v)]).filter(Boolean);
  if (type === 'bar') { const bw = Math.max(2, IW / N * .62); ser[0].d.forEach((v, i) => { if (v == null) return; const y = Y(v), y0 = Y(0); s += `<rect x="${X(i) - bw / 2}" y="${Math.min(y, y0)}" width="${bw}" height="${Math.max(1, Math.abs(y0 - y))}" rx="${Math.min(3, bw / 2)}" fill="currentColor" fill-opacity=".85"/>`; }); }
  else if (opts.smooth) {
    const np = numPts(ser[0].d), topD = smoothPath(np);
    const areaD = topD + `L${X(N - 1).toFixed(1)},${Y(mn).toFixed(1)}L${X(0).toFixed(1)},${Y(mn).toFixed(1)}Z`;
    s += `<path d="${areaD}" fill="${fillAttr}" fill-opacity=".1"/>`;
    ser.forEach(x => s += `<path fill="none" stroke="${x.c}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" d="${smoothPath(numPts(x.d))}"/>`);
  } else {
    const a = pts(ser[0].d), b = ser[1] ? pts(ser[1].d).reverse() : [X(N - 1) + ',' + Y(mn), X(0) + ',' + Y(mn)];
    s += `<polygon points="${a.concat(b).join(' ')}" fill="${fillAttr}" fill-opacity="${opts.colorByValue ? .32 : .1}"/>`;
    ser.forEach(x => s += `<polyline fill="none" stroke="${x.c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="${pts(x.d).join(' ')}"/>`);
  }
  s += `<line class="cur" y1="${Tm}" y2="${H - B}" stroke="currentColor" stroke-opacity=".5" style="display:none"/></svg><div class="tip"></div>`;
  box.innerHTML = s;
  const sv = box.querySelector('svg'), cur = box.querySelector('.cur'), tip = box.querySelector('.tip');
  const mv = e => {
    const r = sv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * Wd;
    let i = type === 'bar' ? Math.floor((x - Lm) / (IW / N)) : Math.round((x - Lm) / (IW / Math.max(1, N - 1))); i = Math.max(0, Math.min(N - 1, i));
    cur.setAttribute('x1', X(i)); cur.setAttribute('x2', X(i)); cur.style.display = 'block';
    tip.style.display = 'block'; tip.innerHTML = `<b>${lb[i]}</b> ` + ser.map(z => `<span style="color:${z.c}">${z.n ? z.n + ' ' : ''}${z.d[i] == null ? '-' : Math.round(z.d[i] * 10) / 10}${u}</span>`).join(' · ');

}
function fxSpans(n, mk) { return Array.from({ length: n }, (_, i) => `<span style="${mk(i)}"></span>`).join(''); }
async function drawDash(n) {
  RANGE = n; const o = $('dash'); o.innerHTML = `<div class="win sub">${t('load')}</div>`;
  try {
    const S = await series(n), lo = S.lo || S.hi, av = a => a.reduce((x, y) => x + (y || 0), 0) / a.length, mean = (av(S.hi) + av(lo)) / 2, mxT = Math.max(...S.hi), mnT = Math.min(...lo);
    const lastIdx = S.wind.length - 1, cc = W.w.current;
    // "right now" values always come from the live current reading (same source as the background), not the separate historical series fetch
    const curWind = Math.round(cc.wind_speed_10m), curGust = Math.round(cc.wind_gusts_10m || 0), curDir = cc.wind_direction_10m;
    const curRain = cc.precipitation || 0, curSnow = cc.snowfall || 0;
    if (n === 1) { S.wind[lastIdx] = cc.wind_speed_10m; S.gust[lastIdx] = cc.wind_gusts_10m; S.rain[lastIdx] = curRain; if (S.snow) S.snow[lastIdx] = curSnow; S.press[lastIdx] = cc.pressure_msl; }
    const totalSnow = (S.snow || []).reduce((a, b) => a + (b || 0), 0), hailN = (S.code || []).filter(c => c === 96 || c === 99).length;
    const kp = [[t('kavg'), Math.round(mean) + '°', tc(mean)], [t('kmax'), Math.round(mxT) + '°', tc(mxT)], [t('kmin'), Math.round(mnT) + '°', tc(mnT)], [t('ktr'), S.rain.reduce((a, b) => a + (b || 0), 0).toFixed(0) + ' mm'], [t('krd'), S.rain.filter(x => x > (n === 1 ? .1 : 1)).length + (n === 1 ? ' h' : '')], [t('kw'), Math.round(Math.max(...S.wind)) + ' km/h']];
    if (totalSnow > 0) kp.push([t('ksnow'), totalSnow.toFixed(1) + ' cm']);
    if (hailN > 0) kp.push([t('khail'), hailN + (n === 1 ? ' h' : ' ' + t('krd').toLowerCase())]);
    const win = (id, ti, de, fx, fxc) => `<section class="win"><div class="tilefx ${fxc || ''}" aria-hidden="true">${fx || ''}</div><div style="position:relative;z-index:1"><h3>${ti}</h3><div class="sub">${de || ''}</div><div class="cb" id="${id}"></div></div></section>`;
    const rainInt = Math.min(1, curRain / 8), windInt = Math.min(1, curWind / 45), snowInt = Math.min(1, curSnow / 3);
    const rainFx = rainInt > .003 ? fxSpans(14, i => `left:${(i * 7.3) % 100}%;top:${45 + (i * 4) % 50}%;animation-duration:${(2.6 - rainInt * 1.8).toFixed(2)}s;animation-delay:${(i * .17) % 1.4}s;height:${14 + rainInt * 10}%`) : '';
    const windFx = fxSpans(5, i => `top:${58 + i * 8}%;animation-duration:${(6 - windInt * 4.5).toFixed(2)}s;animation-delay:${(i * .3) % 2}s`);
    const irMark = Math.max(2, Math.min(98, (mean - mnT) / Math.max(1, mxT - mnT) * 96 + 2));
    const totalRain = S.rain.reduce((a, b) => a + (b || 0), 0), rainDesc = totalRain <= 0 ? t('noRain') : curRain.toFixed(1) + ' mm · ' + t('rainNow').toLowerCase();
    const pFirst = S.press[0], pLast = S.press[S.press.length - 1], pTr = pLast - pFirst, pArrow2 = pTr > 1 ? '↑' : pTr < -1 ? '↓' : '→';
    o.innerHTML = `<section class="win"><div class="kpis">${kp.map(x => `<div><small>${x[0]}</small><b style="color:${x[2] || 'currentColor'}">${x[1]}</b></div>`).join('')}</div></section>`
      + `<section class="win"><h3>${t('cT')}</h3><div class="sub">${t('cTd')}</div><div class="irbar"><b style="left:${irMark}%;color:${tc(mean)}">${Math.round(mean)}°</b></div><div class="cb" id="c1"></div></section>`
      + win('c2', t('cR'), rainDesc, rainFx, 'rainfx')
      + win('c3', t('cW'), curWind + ' km/h ' + dirLabel(curDir) + windArrow(curDir) + ' · ' + t('gust') + ' ' + curGust + ' km/h', windFx, 'windfx')
      + win('c5', t('cP'), Math.round(pLast) + ' hPa ' + pArrow2)
      + (totalSnow > 0 ? win('c4', t('cS'), curSnow.toFixed(1) + ' cm · ' + t('rainNow').toLowerCase().replace('rain', 'snow')) : '');
    chart($('c1'), S.lb, S.lo ? [{ d: S.hi, c: '#ff9a62', n: t('hi') }, { d: S.lo, c: '#6fc8ff', n: t('lo') }] : [{ d: S.hi, c: '#ff9a62', n: t('temp') }], 'band', '°', { colorByValue: true, smooth: true });

    chart($('c5'), S.lb, [{ d: S.press, c: '#c9a6ff', n: t('press') }], 'band', ' hPa', { smooth: true });
    if (totalSnow > 0 && $('c4')) chart($('c4'), S.lb, [{ d: S.snow, c: '#cfe8ff' }], 'bar', ' cm');

}

/* ---------- radar ---------- */
let radarMap = null, radarLayer = null, radarTries = 0;
function initRadar() {
  const box = $('radarMap'); if (!box) return;
  if (typeof L === 'undefined') {
    if (radarTries < 20) { radarTries++; setTimeout(initRadar, 300); return; } // Leaflet script may still be loading
    box.innerHTML = '<div class="sub" style="padding:14px">Map library failed to load (check internet connection) — radar unavailable.</div>';
    return;
  }
  try {
    if (!radarMap) {
      box.innerHTML = '';
      radarMap = L.map('radarMap', { scrollWheelZoom: false, attributionControl: false }).setView([place.lat, place.lon], 7);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 12, subdomains: 'abc' }).addTo(radarMap);
      radarMap._marker = L.marker([place.lat, place.lon]).addTo(radarMap);
      setTimeout(() => radarMap.invalidateSize(), 250);
      setTimeout(() => radarMap.invalidateSize(), 900);
    } else {
      radarMap.setView([place.lat, place.lon], 7);
      radarMap._marker.setLatLng([place.lat, place.lon]);
      radarMap.invalidateSize();
    }
    fetch('https://api.rainviewer.com/public/weather-maps.json').then(r => r.json()).then(d => {
      const frames = d.radar && d.radar.past; if (!frames || !frames.length) return;
      const last = frames[frames.length - 1];
      if (radarLayer) radarMap.removeLayer(radarLayer);
      radarLayer = L.tileLayer(`https://tilecache.rainviewer.com${last.path}/256/{z}/{x}/{y}/2/1_1.png`, { opacity: .55, maxZoom: 12 }).addTo(radarMap);
    }).catch(() => { });
  } catch (e) { box.innerHTML = '<div class="sub" style="padding:14px">Radar could not load.</div>'; }
}
/* ---------- start ---------- */
async function fetchElev(lat, lon) {
  try { const d = await getJSON(`https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lon}`); ELEV = (d.elevation && d.elevation[0]) || 200; } catch (e) { ELEV = 200; }
  if (THEME === 'nature') fit();
}
async function load(name) {
  $('msg').className = 'sub'; $('msg').textContent = t('load');
  try {
    place = name ? await findCity(name) : place; W = await getWeather(place); render(); fetchElev(place.lat, place.lon);
    $('msg').textContent = ''; $('app').hidden = false; initRadar();
    try { localStorage.setItem('city', place.name.split(',')[0]); } catch (e) { }
  } catch (e) { $('msg').className = 'err'; $('msg').textContent = e.message; }
}
async function loadCoords(lat, lon) {
  $('msg').className = 'sub'; $('msg').textContent = t('load');
  try {
    place = await reverseCity(lat, lon); W = await getWeather(place); render(); fetchElev(lat, lon);
    $('msg').textContent = ''; $('app').hidden = false; initRadar();
    try { localStorage.removeItem('city'); } catch (e) { }
  } catch (e) { $('msg').className = 'err'; $('msg').textContent = e.message; }
}
function useLocation() {
  if (!navigator.geolocation) { $('msg').className = 'err'; $('msg').textContent = t('locErr'); return; }
  $('msg').className = 'sub'; $('msg').textContent = t('load');
  navigator.geolocation.getCurrentPosition(
    pos => loadCoords(pos.coords.latitude, pos.coords.longitude),
    () => { $('msg').className = 'err'; $('msg').textContent = t('locErr'); },
    { timeout: 10000 }
  );
}
function applyLang() {
  document.documentElement.lang = L;
  document.querySelectorAll('[data-i]').forEach(e => e.textContent = t(e.dataset.i));
  document.querySelectorAll('[data-p]').forEach(e => e.placeholder = t(e.dataset.p));
  if (W) render();
}
function tabs(id, fn) { $(id).onclick = e => { const b = e.target.closest('button'); if (!b) return; $(id).querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); fn(b); }; }
tabs('ftabs', b => { $('hourly').hidden = b.dataset.v !== 'hourly'; $('daily').hidden = b.dataset.v !== 'daily'; });
tabs('dtabs', b => drawDash(+b.dataset.n));
$('go').onclick = () => { const v = $('q').value.trim(); if (v) load(v); };

$('lang').onchange = e => { L = e.target.value; try { localStorage.setItem('lang', L); } catch (x) { } applyLang(); };
let saved = null, savedTheme = 'dark';
try { saved = localStorage.getItem('city'); L = localStorage.getItem('lang') || 'en'; savedTheme = localStorage.getItem('theme') || 'dark'; } catch (e) { }
setTheme(savedTheme); $('lang').value = L; applyLang(); load(saved || 'Delhi');
</script>
