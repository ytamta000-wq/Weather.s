<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APHELION - Near-Earth Object Observatory</title>
<style>
:root{--bg:#000;--fg:#eaeaea;--mut:#8a8a94;--card:#0b0b0e;--line:#1f1f26;--ac:#5fd4ff;--warn:#ff6b6b}
body.day{--bg:#f4f0e6;--fg:#1b1a17;--mut:#6b675c;--card:#fffdf7;--line:#ddd6c4;--ac:#0b6bcb;--warn:#c2312d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;transition:.3s}
.wrap{max-width:900px;margin:auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:1.3rem;letter-spacing:.3em;margin:0}
h1 small{display:block;font-size:.65rem;letter-spacing:.05em;color:var(--mut);font-weight:400}
button{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:12px;cursor:pointer;font-size:.9rem}
button.on{background:var(--ac);color:#000;border-color:var(--ac);font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0;padding-bottom:4px}
.tabs button{white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpis div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpis small{color:var(--mut);display:block;font-size:.75rem}.kpis b{font-size:1.5rem}
.f{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:1rem;margin-bottom:10px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:.75rem;text-transform:uppercase}
.pha{color:var(--warn);font-weight:700}
.sub{color:var(--mut);font-size:.85rem}
.err{color:var(--warn);padding:10px}
.row{display:flex;gap:8px}.row .f{margin:0}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0}dt{color:var(--mut)}dd{margin:0}
footer{color:var(--mut);font-size:.75rem;margin:24px 0}
a{color:var(--ac)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>APHELION<small>Near-Earth Object Observatory</small></h1>
    <button id="th">Day / Night</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
  <footer>Data: NASA / JPL CNEOS public APIs (Close Approach, Sentry, Fireball, Small-Body Database). No API key needed.</footer>
</div>

<script>
const API = 'https://ssd-api.jpl.nasa.gov/';
const $ = id => document.getElementById(id);
const C = '&fullname=true&diameter=true';
const Q = {
  week: `cad.api?date-min=now&date-max=%2B7&dist-max=20LD&neo=true${C}&sort=date&limit=80`,
  app: `cad.api?date-min=now&date-max=%2B60&dist-max=0.05&neo=true${C}&sort=date&limit=80`,
  pha: `cad.api?date-min=now&date-max=%2B365&dist-max=0.05&pha=true${C}&sort=dist&limit=80`,
  sen: 'sentry.api',
  fb: 'fireball.api?limit=50&req-loc=true'
};
const cache = {};
async function j(p) { const r = await fetch(API + p); if (!r.ok) throw new Error('JPL server error ' + r.status); return r.json(); }
async function get(k) { return cache[k] || (cache[k] = await j(Q[k])); }
const rows = o => { const f = o.fields || []; return (o.data || []).map(r => { const x = {}; f.forEach((k, i) => x[k] = r[i]); return x; }); };

/* ---------- formatting ---------- */
const LD = au => au * 389.17;              // AU se lunar distance
const num = (v, d = 2) => v == null || v === '' || isNaN(+v) ? '-' : (+v).toLocaleString('en-US', { maximumFractionDigits: d });
const name = x => (x.fullname || x.des || '').trim();
const size = k => k == null || k === '' ? '-' : (+k < 1 ? Math.round(+k * 1000) + ' m' : num(k, 2) + ' km');
const isPha = x => x.h != null && +x.h <= 22 && +x.dist <= 0.05;
const dt = s => (s || '').slice(0, 16);

function table(cols, data, box) {
  box.innerHTML = `<input class="f" placeholder="Search / filter...">
    <div class="tw"><table><tr>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr>${data.map(r => `<tr>${cols.map(c => `<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</table></div>
    <div class="sub" style="margin-top:8px">${data.length} objects</div>`;
  box.querySelector('.f').oninput = e => { const q = e.target.value.toLowerCase(); box.querySelectorAll('tr:not(:first-child)').forEach(tr => tr.hidden = !tr.textContent.toLowerCase().includes(q)); };
}
const cadCols = [
  ['Object', x => name(x) + (isPha(x) ? ' <span class="pha">PHA</span>' : '')],
  ['Date (UTC)', x => dt(x.cd)], ['Distance (LD)', x => num(LD(x.dist), 1)], ['Distance (km)', x => num(x.dist * 149597870.7, 0)],
  ['Speed (km/s)', x => num(x.v_rel, 1)], ['Size', x => size(x.diameter)], ['H', x => num(x.h, 1)]
];

/* ---------- views ---------- */
const V = {
  async dash(box) {
    const [wk, pha, sen, fb] = await Promise.all([get('week'), get('pha'), get('sen'), get('fb')]);
    const w = rows(wk), closest = [...w].sort((a, b) => a.dist - b.dist)[0], M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(Date.now() + i * 864e5); return { k: `${d.getUTCFullYear()}-${M[d.getUTCMonth()]}-${String(d.getUTCDate()).padStart(2, '0')}`, n: 0 }; });
    w.forEach(x => { const d = days.find(y => y.k === x.cd.slice(0, 11)); if (d) d.n++; });
    const mx = Math.max(1, ...days.map(d => d.n)), bw = 80;
    const bars = days.map((d, i) => { const h = d.n / mx * 110; return `<rect x="${i * bw + 14}" y="${130 - h}" width="52" height="${h}" rx="6" fill="var(--ac)"/><text x="${i * bw + 40}" y="${122 - h}" fill="currentColor" font-size="12" text-anchor="middle">${d.n}</text><text x="${i * bw + 40}" y="148" fill="currentColor" opacity=".6" font-size="11" text-anchor="middle">${d.k.slice(5)}</text>`; }).join('');
    box.innerHTML = `<div class="kpis">
      <div><small>Flybys, next 7 days</small><b>${w.length}</b></div>
      <div><small>Closest miss</small><b>${closest ? num(LD(closest.dist), 1) + ' LD' : '-'}</b><small>${closest ? name(closest) : ''}</small></div>
      <div><small>Hazardous (1 year)</small><b>${rows(pha).length}</b></div>
      <div><small>Sentry watchlist</small><b>${(sen.data || []).length}</b></div>
      <div><small>Recent fireballs</small><b>${rows(fb).length}</b></div></div>
      <div class="card"><b>Approaches per day (next 7 days)</b><svg viewBox="0 0 560 156" width="100%" style="margin-top:8px">${bars}</svg><div class="sub">1 LD = one Earth to Moon distance (about 384,400 km)</div></div>
      <div class="card"><b>Closest flybys this week</b><div id="cl"></div></div>`;
    table(cadCols, [...w].sort((a, b) => a.dist - b.dist).slice(0, 8), $('cl'));
  },
  async app(box) { table(cadCols, rows(await get('app')), box); },
  async pha(box) { table(cadCols, rows(await get('pha')), box); },
  async sen(box) {
    const d = (await get('sen')).data || [];
    d.sort((a, b) => +b.ip - +a.ip);
    table([['Object', x => name(x)], ['Impact probability', x => (+x.ip).toExponential(2)], ['Palermo (cum.)', x => num(x.ps_cum, 2)], ['Torino', x => x.ts_max], ['Size', x => size(x.diameter)], ['Impacts', x => x.n_imp], ['Years', x => x.range], ['Last obs.', x => x.last_obs]], d.slice(0, 150), box);
  },
  async fb(box) {
    table([['Date (UTC)', x => x.date], ['Energy (kt)', x => num(x.energy, 2)], ['Impact energy (kt)', x => num(x['impact-e'], 3)], ['Location', x => x.lat ? `${num(x.lat, 1)}° ${x['lat-dir'] || ''}, ${num(x.lon, 1)}° ${x['lon-dir'] || ''}` : '-'], ['Altitude (km)', x => num(x.alt, 1)], ['Speed (km/s)', x => num(x.vel, 1)]], rows(await get('fb')), box);
  },
  async cat(box) {
    box.innerHTML = `<div class="row"><input class="f" id="sq" placeholder="Name or number, e.g. Apophis, 433, 99942"><button id="sb">Look up</button></div><div id="so" class="card sub">Search the JPL Small-Body Database.</div>`;
    const go = async q => {
      $('so').innerHTML = 'Loading...';
      try {
        const d = await j('sbdb.api?sstr=' + encodeURIComponent(q) + '&phys-par=true&discovery=true');
        if (d.list) { $('so').innerHTML = '<b>Several matches, pick one:</b><br>' + d.list.slice(0, 12).map(x => `<button style="margin:4px 4px 0 0" data-q="${x.pdes}">${x.name}</button>`).join(''); $('so').querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.q)); return; }
        if (!d.object) throw new Error(d.message || 'Not found');
        const o = d.object, pp = (d.phys_par || []).slice(0, 10);
        $('so').innerHTML = `<h3 style="margin:0">${o.fullname}</h3><div class="sub">${o.orbit_class ? o.orbit_class.name : ''} ${o.neo ? '· NEO' : ''} ${o.pha ? '<span class="pha">· Potentially Hazardous</span>' : ''}</div>
          <dl>${d.orbit && d.orbit.moid ? `<dt>Earth MOID</dt><dd>${d.orbit.moid} AU</dd>` : ''}${d.discovery && d.discovery.date ? `<dt>Discovered</dt><dd>${d.discovery.date}</dd>` : ''}${pp.map(p => `<dt>${p.title}</dt><dd>${p.value} ${p.units || ''}</dd>`).join('')}</dl>
          <a target="_blank" rel="noopener" href="https://ssd.jpl.nasa.gov/tools/sbdb_lookup.html#/?sstr=${encodeURIComponent(o.des)}">Open in JPL</a>`;
      } catch (e) { $('so').innerHTML = `<span class="err">${e.message}</span>`; }
    };
    $('sb').onclick = () => { const q = $('sq').value.trim(); if (q) go(q); };
    $('sq').onkeydown = e => { if (e.key === 'Enter') $('sb').click(); };
  }
};

/* ---------- app shell ---------- */
const TABS = [['dash', 'Dashboard'], ['app', 'Approaches'], ['pha', 'Hazardous'], ['sen', 'Impact risk'], ['fb', 'Fireballs'], ['cat', 'Catalog']];
async function show(k) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  const box = $('view'); box.innerHTML = '<div class="card sub">Loading live data from NASA JPL...</div>';
  try { const el = document.createElement('div'); await V[k](el); box.innerHTML = ''; box.appendChild(el); }
  catch (e) { box.innerHTML = `<div class="card"><div class="err">Could not load data: ${e.message}</div><button id="rt">Retry</button></div>`; $('rt').onclick = () => show(k); }
}
TABS.forEach(([k, l]) => { const b = document.createElement('button'); b.dataset.k = k; b.textContent = l; b.onclick = () => show(k); $('tabs').appendChild(b); });
$('th').onclick = () => { document.body.classList.toggle('day'); try { localStorage.setItem('day', document.body.classList.contains('day') ? 1 : 0); } catch (e) { } };
try { if (localStorage.getItem('day') === '1') document.body.classList.add('day'); } catch (e) { }
show('dash');
</script>
</body>
</html>
