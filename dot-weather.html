<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dotcast Weather</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0a0a0a}
body{font-family:"Helvetica Neue",system-ui,'Noto Sans Devanagari',Arial,sans-serif;color:#fff}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.wrap{position:relative;z-index:1;max-width:600px;margin:auto;padding:14px 14px 60px}
.win{background:rgba(10,10,10,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);border-radius:26px;padding:16px;margin:14px 0}
.row{display:flex;gap:8px;align-items:center}
input,select{flex:1;min-width:0;padding:11px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#fff;font-size:1rem;outline:0}
select{flex:0 0 auto;padding:8px 10px}select option{color:#000}
input::placeholder{color:rgba(255,255,255,.45)}
button{padding:10px 18px;border:0;border-radius:20px;background:#fff;color:#000;font-weight:600;font-size:.92rem;cursor:pointer}
.bar2{display:flex;justify-content:space-between;align-items:center;margin:10px 2px}
.brand{letter-spacing:.35em;font-size:.8rem;opacity:.7}
h3{margin:0 0 4px;font-weight:500;font-size:1.02rem}
.sub{opacity:.55;font-size:.85rem}
.aqi{display:flex;align-items:center;gap:14px}
.aqi>b{font-size:2.6rem;font-weight:300;line-height:1}
.bar{height:4px;border-radius:4px;background:linear-gradient(90deg,#2ecc71,#f1c40f,#ff9f1a,#ff4d4d,#b455ff,#c2223d);margin-top:12px;position:relative}
.bar s{position:absolute;top:-4px;width:3px;height:12px;background:#fff;border-radius:2px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.big{font-size:6.2rem;font-weight:200;line-height:.95;letter-spacing:-.03em}
.right{text-align:right;font-size:1.05rem}
.right svg{width:34px;height:34px;vertical-align:middle;margin-right:6px}
.city{opacity:.7;margin:0 0 6px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
.grid div,.kpis div{background:rgba(255,255,255,.05);border-radius:16px;padding:9px 13px;font-size:.92rem}
small{display:block;opacity:.5;font-size:.72rem;letter-spacing:.04em}
.tips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.tips h4{margin:0 0 4px;font-weight:500}.tips ul{margin:0;padding-left:16px;font-size:.88rem;opacity:.9}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.12)}
.tabs button.on{background:#fff;color:#000}
.stk{position:sticky;top:8px;z-index:5;padding:6px;border-radius:24px;background:rgba(10,10,10,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);margin:14px 0}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin-top:12px}
.hr{min-width:60px;text-align:center;font-size:.85rem}
.hr svg,.dy svg{width:30px;height:30px;margin:4px 0}
.dy{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.dy span:first-child{width:70px}.dy span:last-child{margin-left:auto}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.92rem}
td,th{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.08);text-align:center;font-weight:400}
td:first-child{text-align:left;opacity:.55}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kpis b{display:block;font-size:1.15rem;font-weight:400}
.cb{position:relative;margin-top:8px;touch-action:pan-y}
.tip{position:absolute;top:0;left:44px;font-size:.78rem;background:#000;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:5px 8px;pointer-events:none;display:none;white-space:nowrap}
.err{color:#ff8b8b;padding:8px}
.d{animation:fall 1s linear infinite}.bl{animation:fl 2.4s infinite}
@keyframes fall{from{transform:translateY(-3px);opacity:1}to{transform:translateY(8px);opacity:0}}
@keyframes fl{0%,60%,100%{opacity:.25}70%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="win row" style="margin-top:0"><input id="q" data-p="ph" autocomplete="off"><button id="go" data-i="go"></button></div>
  <div class="bar2"><span class="brand">DOTCAST</span><select id="lang"><option value="en">English</option><option value="hi">हिन्दी</option></select></div>
  <div id="msg" class="sub"></div>
  <main id="app" hidden>
    <section class="win" id="aqi"></section>
    <section class="win" id="hero"></section>
    <section class="win" id="tips"></section>
    <section class="win">
      <div class="tabs" id="ftabs"><button class="on" data-v="hourly" data-i="hourly"></button><button data-v="daily" data-i="week"></button></div>
      <div class="strip" id="hourly"></div><div id="daily" hidden style="margin-top:10px"></div>
    </section>
    <section class="win">
      <h3 data-i="cmp"></h3>
      <div class="row"><input id="q2" data-p="cph"><button id="cmpb" data-i="cbtn"></button></div>
      <div id="cmpOut"></div>
    </section>
    <h3 style="margin:22px 4px 0" data-i="dash"></h3>
    <div class="tabs stk" id="dtabs"><button class="on" data-n="1" data-i="r1"></button><button data-n="7" data-i="r7"></button><button data-n="30" data-i="r30"></button><button data-n="90" data-i="r90"></button></div>
    <div id="dash"></div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
let place = { name: 'Delhi', lat: 28.6139, lon: 77.209 }, W = null, L = 'en', RANGE = 1;

const T = {
en: { ph: 'Search a city (e.g. Delhi)', go: 'Search', aqi: 'Air Quality', a: ['Good', 'Moderate', 'Unhealthy for sensitive groups', 'Unhealthy', 'Very unhealthy', 'Hazardous'], na: 'AQI not available',
  feels: 'Feels like', hum: 'Humidity', wind: 'Wind', press: 'Pressure', pop: 'Rain chance', uv: 'UV index', rise: 'Sunrise', set: 'Sunset', temp: 'Temp',
  tips: 'Life tips', yes: 'Do', no: 'Avoid', n0: 'Rain is likely right now', nN: 'Rain likely in {n} h', nX: 'No significant rain in the next 12 h',
  hourly: 'Hourly', week: '7 days', cmp: 'Compare cities', cph: 'Second city (e.g. Mumbai)', cbtn: 'Compare', dash: 'Dashboard', r1: '24 h', r7: '7 days', r30: '30 days', r90: '90 days',
  c: { clear: 'Clear sky', partly: 'Partly cloudy', cloud: 'Overcast', fog: 'Fog', rain: 'Rain', snow: 'Snow', storm: 'Thunderstorm' },
  kavg: 'Average', kmax: 'Highest', kmin: 'Lowest', ktr: 'Total rain', krd: 'Rainy days', kw: 'Max wind',
  cT: 'Temperature', cTd: 'High and low over the period', cR: 'Rainfall', cW: 'Wind speed', hi: 'High', lo: 'Low', load: 'Loading...', nf: 'City not found. Check the spelling.',
  p: { storm: ['Stay indoors, keep your phone charged', 'Open fields, trees and power poles'], rain: ['Carry an umbrella or raincoat', 'Long bike rides and flooded roads'], hot: ['Drink plenty of water, wear light cotton', 'Going out between 12 and 4 pm'], cold: ['Wear warm clothes and a jacket', 'Stepping out without a jacket'], uv: ['Use sunscreen and a cap', 'Long stretches in strong sun'], aq: ['Wear an N95 mask', 'Running or exercising outside'], aq2: ['Sensitive people should wear a mask'], wind: ['Keep windows and doors shut', 'Rooftops and high places'], fog: ['Switch on your headlights', 'Driving fast'], ok: ['Good time for a walk or outdoor work', 'Nothing special to avoid'] } },
hi: { ph: 'शहर खोजें (जैसे दिल्ली)', go: 'खोजें', aqi: 'वायु गुणवत्ता', a: ['अच्छी', 'सामान्य', 'संवेदनशील लोगों के लिए खराब', 'खराब', 'बहुत खराब', 'खतरनाक'], na: 'AQI उपलब्ध नहीं है',
  feels: 'महसूस', hum: 'नमी', wind: 'हवा', press: 'दबाव', pop: 'बारिश की संभावना', uv: 'यूवी इंडेक्स', rise: 'सूर्योदय', set: 'सूर्यास्त', temp: 'तापमान',
  tips: 'सुझाव', yes: 'करें', no: 'बचें', n0: 'अभी बारिश की संभावना है', nN: '{n} घंटे में बारिश की संभावना', nX: 'अगले 12 घंटे में बारिश की खास संभावना नहीं',
  hourly: 'घंटेवार', week: '7 दिन', cmp: 'शहरों की तुलना', cph: 'दूसरा शहर (जैसे मुंबई)', cbtn: 'तुलना करें', dash: 'डैशबोर्ड', r1: '24 घंटे', r7: '7 दिन', r30: '30 दिन', r90: '90 दिन',
  c: { clear: 'साफ़ आसमान', partly: 'हल्के बादल', cloud: 'बादल छाए', fog: 'कोहरा', rain: 'बारिश', snow: 'बर्फबारी', storm: 'बिजली के साथ तूफ़ान' },
  kavg: 'औसत', kmax: 'सबसे ज़्यादा', kmin: 'सबसे कम', ktr: 'कुल बारिश', krd: 'बारिश वाले दिन', kw: 'अधिकतम हवा',
  cT: 'तापमान', cTd: 'इस अवधि का अधिकतम और न्यूनतम', cR: 'बारिश', cW: 'हवा की गति', hi: 'अधिकतम', lo: 'न्यूनतम', load: 'लोड हो रहा है...', nf: 'शहर नहीं मिला। स्पेलिंग जाँचें।',
  p: { storm: ['घर के अंदर रहें, फ़ोन चार्ज रखें', 'खुले मैदान, पेड़ या बिजली के खंभे के पास जाना'], rain: ['छाता या रेनकोट साथ रखें', 'बाइक से लंबा सफ़र, जलभराव वाली सड़क'], hot: ['खूब पानी पिएँ, हल्के सूती कपड़े पहनें', 'दोपहर 12 से 4 बजे बाहर घूमना'], cold: ['गर्म कपड़े और जैकेट पहनें', 'बिना जैकेट बाहर निकलना'], uv: ['सनस्क्रीन और टोपी लगाएँ', 'तेज़ धूप में देर तक रहना'], aq: ['N95 मास्क पहनें', 'बाहर दौड़ना या व्यायाम करना'], aq2: ['बीमार और बुज़ुर्ग मास्क पहनें'], wind: ['खिड़की-दरवाज़े बंद रखें', 'छत या ऊँची जगह पर जाना'], fog: ['गाड़ी की हेडलाइट जलाएँ', 'तेज़ रफ़्तार से गाड़ी चलाना'], ok: ['सैर या बाहर के काम के लिए अच्छा समय', 'कोई खास परहेज़ नहीं'] } }
};
const t = k => (T[L] && T[L][k] !== undefined ? T[L][k] : T.en[k]);

async function getJSON(u) { const r = await fetch(u); if (!r.ok) throw new Error('Server error ' + r.status); return r.json(); }
const tc = v => `hsl(${210 - (Math.max(-5, Math.min(45, v)) + 5) / 50 * 210},85%,68%)`;
const mins = s => +s.slice(11, 13) * 60 + +s.slice(14, 16);
const hourLabel = s => { const h = +s.slice(11, 13); return (h % 12 || 12) + (h < 12 ? ' AM' : ' PM'); };
const fmtDate = s => new Date(s.slice(0, 10) + 'T12:00:00').toLocaleDateString(L === 'hi' ? 'hi-IN' : 'en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
const dayLabel = s => new Date(s + 'T12:00:00').toLocaleDateString(L === 'hi' ? 'hi-IN' : 'en-IN', { weekday: 'short', day: 'numeric' });
const aqiInfo = v => { const i = v <= 50 ? 0 : v <= 100 ? 1 : v <= 150 ? 2 : v <= 200 ? 3 : v <= 300 ? 4 : 5; return [['#2ecc71', '#f1c40f', '#ff9f1a', '#ff4d4d', '#b455ff', '#c2223d'][i], t('a')[i]]; };
function kind(c) {
  if (c === 0) return 'clear'; if (c <= 2) return 'partly'; if (c === 3) return 'cloud'; if (c === 45 || c === 48) return 'fog';
  if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) return 'rain'; if ((c >= 71 && c <= 77) || c === 85 || c === 86) return 'snow'; if (c >= 95) return 'storm'; return 'cloud';
}

/* minimal white line icons (lock screen jaise) */
const CLD = '<path d="M18 44h28a10 10 0 0 0 1-20 14 14 0 0 0-27-3A11 11 0 0 0 18 44z"/>';
const SUNI = `<circle cx="32" cy="32" r="9"/>${[0, 45, 90, 135, 180, 225, 270, 315].map(a => `<line x1="32" y1="13" x2="32" y2="7" transform="rotate(${a} 32 32)"/>`).join('')}`;
const MOONI = '<path d="M40 12A20 20 0 1 0 52 40 16 16 0 0 1 40 12z"/>';
function icon(code, day) {
  const k = kind(code); let s = '';
  if (k === 'clear') s = day ? SUNI : MOONI;
  else if (k === 'partly') s = `<g transform="translate(-6,-8) scale(.7)">${day ? SUNI : MOONI}</g><g transform="translate(4,4)">${CLD}</g>`;
  else if (k === 'cloud') s = CLD;
  else if (k === 'fog') s = CLD + '<line x1="16" y1="52" x2="48" y2="52"/><line x1="22" y1="58" x2="42" y2="58"/>';
  else if (k === 'rain') s = CLD + [24, 34, 44].map((x, i) => `<line class="d" x1="${x}" y1="50" x2="${x - 3}" y2="57" style="animation-delay:${i * .3}s"/>`).join('');
  else if (k === 'snow') s = CLD + [24, 34, 44].map((x, i) => `<circle class="d" cx="${x}" cy="54" r="1.5" style="animation-delay:${i * .4}s"/>`).join('');
  else s = CLD + '<polyline class="bl" points="34,44 28,54 36,54 30,62"/>';
  return `<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${s}</svg>`;
}

/* ---------- dotted vortex background (home screen jaisa) ---------- */
const cv = $('fx'), g = cv.getContext('2d'), RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
let FX = { k: 'clear', day: 1, f: .5 }, PT = [], flash = 0;
function fit() { cv.width = innerWidth; cv.height = innerHeight; setFx(FX.k, FX.day, FX.f); }
function setFx(k, day, f) {
  FX = { k, day, f }; const n = RM ? 0 : ({ rain: 150, storm: 220, snow: 90 }[k] || 0);
  PT = Array.from({ length: n }, () => ({ x: Math.random() * cv.width, y: Math.random() * cv.height, v: .6 + Math.random() }));
}
function frame(ms) {
  const w = cv.width, h = cv.height, { k, day, f } = FX;
  g.fillStyle = '#0a0a0a'; g.fillRect(0, 0, w, h);
  const cx = w * .5, cy = h * .42, R = Math.hypot(w, h) * .6, rot = RM ? 0 : ms * (k === 'storm' ? .00016 : .00005), a = k === 'fog' ? .45 : 1;
  for (let r = 34; r < R; r += 26) {
    const n = Math.floor(r * .2), q = r / R, sz = Math.pow(q, 1.6) * 3.4;
    if (sz < .4) continue;
    g.fillStyle = `rgba(255,255,255,${Math.min(1, q * 1.5) * a})`; g.beginPath();
    for (let i = 0; i < n; i++) {
      const th = i / n * 6.2832 + rot * (1.6 - q) + r * .015, x = cx + Math.cos(th) * r, y = cy + Math.sin(th) * r * 1.3;
      if (x < -6 || x > w + 6 || y < -6 || y > h + 6) continue;
      g.moveTo(x + sz, y); g.arc(x, y, sz, 0, 6.2832);
    }
    g.fill();
  }
  if (k === 'clear' || k === 'partly') { // sun/moon ka halka glow, time ke hisaab se
    const x = w * (.1 + f * .8), y = h * .2 - Math.sin(Math.PI * f) * h * .1, rg = g.createRadialGradient(x, y, 0, x, y, 130);
    rg.addColorStop(0, day ? 'rgba(255,240,200,.28)' : 'rgba(210,220,255,.2)'); rg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = rg; g.fillRect(0, 0, w, h);
  }
  if (k === 'rain' || k === 'storm') { g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1.1; g.beginPath(); PT.forEach(p => { g.moveTo(p.x, p.y); g.lineTo(p.x - 2, p.y + 10 + 12 * p.v); p.y += 14 * p.v + 6; p.x -= 1.5; if (p.y > h) { p.y = -20; p.x = Math.random() * (w + 40); } }); g.stroke(); }
  if (k === 'snow') { g.fillStyle = 'rgba(255,255,255,.85)'; PT.forEach(p => { g.beginPath(); g.arc(p.x, p.y, 1 + p.v * 1.5, 0, 7); g.fill(); p.y += p.v * 1.3; p.x += Math.sin(ms / 900 + p.y * .01) * .5; if (p.y > h) { p.y = -5; p.x = Math.random() * w; } }); }
  if (k === 'storm') { if (!RM && Math.random() < .006) flash = 1; if (flash > .02) { g.fillStyle = `rgba(255,255,255,${flash * .22})`; g.fillRect(0, 0, w, h); flash *= .9; } }
  requestAnimationFrame(frame);
}
addEventListener('resize', fit); fit(); requestAnimationFrame(frame);

/* ---------- data ---------- */
async function findCity(q) {
  const d = await getJSON('https://geocoding-api.open-meteo.com/v1/search?count=1&language=' + L + '&name=' + encodeURIComponent(q));
  if (!d.results) throw new Error(t('nf'));
  const r = d.results[0]; return { name: r.name + (r.admin1 ? ', ' + r.admin1 : ''), lat: r.latitude, lon: r.longitude };
}
async function getWeather(p) {
  const f = getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,pressure_msl&hourly=temperature_2m,weather_code,precipitation_probability,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset&timezone=auto&past_days=1&forecast_days=8`);
  const a = getJSON(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${p.lat}&longitude=${p.lon}&current=us_aqi,pm2_5,pm10`).catch(() => null);
  const [w, q] = await Promise.all([f, a]); return { w, q };
}
const hourNow = w => w.hourly.time.findIndex(x => x.startsWith(w.current.time.slice(0, 13)));
const todayIdx = w => w.daily.time.indexOf(w.current.time.slice(0, 10));

/* ---------- render ---------- */
function render() {
  const { w, q } = W, c = w.current, i = hourNow(w), d = todayIdx(w), k = kind(c.weather_code), tp = Math.round(c.temperature_2m);
  if (q && q.current && q.current.us_aqi != null) {
    const v = q.current.us_aqi, [col, tx] = aqiInfo(v);
    $('aqi').innerHTML = `<div class="aqi"><b style="color:${col}">${v}</b><div><div>${t('aqi')}: <span style="color:${col}">${tx}</span></div><div class="sub">PM2.5 ${q.current.pm2_5} · PM10 ${q.current.pm10}</div></div></div><div class="bar"><s style="left:${Math.min(v, 400) / 4}%"></s></div>`;
  } else $('aqi').innerHTML = `<div class="sub">${t('na')}</div>`;
  let f = .5;
  if (k === 'clear' || k === 'partly') {
    const rise = mins(w.daily.sunrise[d]), set = mins(w.daily.sunset[d]), now = mins(c.time);
    f = c.is_day ? (now - rise) / (set - rise) : ((now >= set ? now - set : now + 1440 - set) / (1440 - set + rise)); f = Math.max(0, Math.min(1, f));
  }
  setFx(k, c.is_day, f);
  const rp = w.daily.precipitation_probability_max[d];
  $('hero').innerHTML = `<div class="city">${place.name}</div><div class="hero"><div class="big" style="color:${tc(tp)}">${tp}°</div><div class="right">${icon(c.weather_code, c.is_day)}${t('c')[k]}<div class="sub">${fmtDate(c.time)} · ${c.time.slice(11)}</div></div></div><div class="grid">${[
    [t('feels'), Math.round(c.apparent_temperature) + '°C'], [t('hum'), c.relative_humidity_2m + '%'], [t('wind'), c.wind_speed_10m + ' km/h'], [t('press'), Math.round(c.pressure_msl) + ' hPa'],
    [t('pop'), rp + '%'], [t('uv'), w.daily.uv_index_max[d]], [t('rise'), w.daily.sunrise[d].slice(11)], [t('set'), w.daily.sunset[d].slice(11)]
  ].map(x => `<div><small>${x[0]}</small>${x[1]}</div>`).join('')}</div>`;
  tips(w, q, d, i);
  $('hourly').innerHTML = Array.from({ length: 24 }, (_, j) => i + j).map(n => `<div class="hr"><div class="sub">${hourLabel(w.hourly.time[n])}</div>${icon(w.hourly.weather_code[n], w.hourly.is_day[n])}<div style="color:${tc(w.hourly.temperature_2m[n])}">${Math.round(w.hourly.temperature_2m[n])}°</div><div class="sub">${w.hourly.precipitation_probability[n]}%</div></div>`).join('');
  $('daily').innerHTML = Array.from({ length: 7 }, (_, j) => d + j).map(n => `<div class="dy"><span>${dayLabel(w.daily.time[n])}</span>${icon(w.daily.weather_code[n], 1)}<span class="sub">${w.daily.precipitation_probability_max[n]}%</span><span><b style="font-weight:500;color:${tc(w.daily.temperature_2m_max[n])}">${Math.round(w.daily.temperature_2m_max[n])}°</b> / <span style="color:${tc(w.daily.temperature_2m_min[n])}">${Math.round(w.daily.temperature_2m_min[n])}°</span></span></div>`).join('');
  $('cmpOut').innerHTML = ''; drawDash(RANGE);
}
function tips(w, q, d, i) {
  const c = w.current, k = kind(c.weather_code), tp = c.temperature_2m, uv = w.daily.uv_index_max[d], P = t('p');
  const aqi = q && q.current && q.current.us_aqi ? q.current.us_aqi : 0, probs = w.hourly.precipitation_probability.slice(i, i + 12), yes = [], no = [];
  const add = x => { yes.push(x[0]); if (x[1]) no.push(x[1]); };
  if (k === 'storm') add(P.storm); else if (k === 'rain' || Math.max(...probs) >= 50) add(P.rain);
  if (tp >= 38) add(P.hot); if (tp <= 10) add(P.cold); if (uv >= 6) add(P.uv);
  if (aqi > 150) add(P.aq); else if (aqi > 100) add(P.aq2);
  if (c.wind_speed_10m >= 30) add(P.wind); if (k === 'fog') add(P.fog);
  if (!yes.length) add(P.ok);
  const hr = probs.findIndex(p => p >= 50), nx = hr === 0 ? t('n0') : hr > 0 ? t('nN').replace('{n}', hr) : t('nX');
  $('tips').innerHTML = `<h3>${t('tips')}</h3><div class="sub">${nx}</div><div class="tips"><div><h4 style="color:#5be38f">${t('yes')}</h4><ul>${yes.map(x => `<li>${x}</li>`).join('')}</ul></div><div><h4 style="color:#ff8b8b">${t('no')}</h4><ul>${no.map(x => `<li>${x}</li>`).join('')}</ul></div></div>`;
}
const summ = o => { const w = o.w, c = w.current, d = todayIdx(w); return { tp: c.temperature_2m, fl: c.apparent_temperature, hu: c.relative_humidity_2m, wi: c.wind_speed_10m, ra: w.daily.precipitation_probability_max[d], uv: w.daily.uv_index_max[d], aq: o.q && o.q.current ? o.q.current.us_aqi : null }; };
async function compare() {
  const name = $('q2').value.trim(); if (!name) return; $('cmpOut').innerHTML = `<div class="sub">${t('load')}</div>`;
  try {
    const p = await findCity(name), B = await getWeather(p), a = summ(W), b = summ(B), r = Math.round;
    const cell = (v, col, u) => `<td style="color:${col || 'inherit'}">${v == null ? '-' : v + (u || '')}</td>`, ac = v => v == null ? '' : aqiInfo(v)[0];
    $('cmpOut').innerHTML = `<table><tr><th></th><th>${place.name.split(',')[0]}</th><th>${p.name.split(',')[0]}</th></tr>
      <tr><td>${t('temp')}</td>${cell(r(a.tp), tc(a.tp), '°')}${cell(r(b.tp), tc(b.tp), '°')}</tr><tr><td>${t('feels')}</td>${cell(r(a.fl), tc(a.fl), '°')}${cell(r(b.fl), tc(b.fl), '°')}</tr>
      <tr><td>${t('hum')}</td>${cell(a.hu, '', '%')}${cell(b.hu, '', '%')}</tr><tr><td>${t('wind')}</td>${cell(a.wi, '', ' km/h')}${cell(b.wi, '', ' km/h')}</tr>
      <tr><td>${t('pop')}</td>${cell(a.ra, '', '%')}${cell(b.ra, '', '%')}</tr><tr><td>${t('uv')}</td>${cell(a.uv)}${cell(b.uv)}</tr><tr><td>AQI</td>${cell(a.aq, ac(a.aq))}${cell(b.aq, ac(b.aq))}</tr></table>`;
  } catch (e) { $('cmpOut').innerHTML = `<div class="err">${e.message}</div>`; }
}

/* ---------- dashboard ---------- */
async function series(n) {
  const base = `latitude=${place.lat}&longitude=${place.lon}&timezone=auto`, key = W.w.current.time.slice(0, 13);
  if (n === 1) {
    const f = await getJSON(`https://api.open-meteo.com/v1/forecast?${base}&hourly=temperature_2m,precipitation,wind_speed_10m&past_days=1&forecast_days=1`);
    const i = f.hourly.time.findIndex(x => x.startsWith(key)), sl = a => a.slice(i - 23, i + 1);
    return { lb: sl(f.hourly.time).map(x => x.slice(11, 16)), hi: sl(f.hourly.temperature_2m), lo: null, rain: sl(f.hourly.precipitation), wind: sl(f.hourly.wind_speed_10m) };
  }
  const f = await getJSON(`https://api.open-meteo.com/v1/forecast?${base}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max&past_days=${n}&forecast_days=1`);
  return { lb: f.daily.time.map(x => x.slice(5)), hi: f.daily.temperature_2m_max, lo: f.daily.temperature_2m_min, rain: f.daily.precipitation_sum, wind: f.daily.wind_speed_10m_max };
}
function chart(box, lb, ser, type, u) {
  const Wd = 640, H = 230, Lm = 44, R = 10, Tm = 12, B = 26, N = lb.length, IW = Wd - Lm - R;
  const all = ser.flatMap(s => s.d).filter(v => v != null); let mn = Math.min(...all), mx = Math.max(...all);
  if (type === 'bar') mn = Math.min(0, mn); if (mx === mn) mx = mn + 1; const pd = (mx - mn) * .08; if (type !== 'bar') mn -= pd; mx += pd;
  const X = i => Lm + (type === 'bar' ? (i + .5) * IW / N : i * IW / Math.max(1, N - 1)), Y = v => Tm + (1 - (v - mn) / (mx - mn)) * (H - Tm - B);
  let s = `<svg viewBox="0 0 ${Wd} ${H}" width="100%">`;
  for (let j = 0; j <= 4; j++) { const v = mn + (mx - mn) * j / 4, y = Y(v); s += `<line x1="${Lm}" x2="${Wd - R}" y1="${y}" y2="${y}" stroke="#fff" stroke-opacity=".1"/><text x="${Lm - 6}" y="${y + 4}" fill="#fff" fill-opacity=".6" font-size="11" text-anchor="end">${Math.round(v)}</text>`; }
  for (let j = 0; j < 5; j++) { const i = Math.round(j * (N - 1) / 4); s += `<text x="${X(i)}" y="${H - 6}" fill="#fff" fill-opacity=".6" font-size="11" text-anchor="middle">${lb[i]}</text>`; }
  const pts = d => d.map((v, i) => v == null ? null : X(i).toFixed(1) + ',' + Y(v).toFixed(1)).filter(Boolean);
  if (type === 'bar') { const bw = Math.max(2, IW / N * .62); ser[0].d.forEach((v, i) => { if (v == null) return; const y = Y(v), y0 = Y(0); s += `<rect x="${X(i) - bw / 2}" y="${Math.min(y, y0)}" width="${bw}" height="${Math.max(1, Math.abs(y0 - y))}" rx="${Math.min(3, bw / 2)}" fill="#fff" fill-opacity=".85"/>`; }); }
  else {
    const a = pts(ser[0].d), b = ser[1] ? pts(ser[1].d).reverse() : [X(N - 1) + ',' + Y(mn), X(0) + ',' + Y(mn)];
    s += `<polygon points="${a.concat(b).join(' ')}" fill="#fff" fill-opacity=".1"/>`;
    ser.forEach(x => s += `<polyline fill="none" stroke="${x.c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="${pts(x.d).join(' ')}"/>`);
  }
  s += `<line class="cur" y1="${Tm}" y2="${H - B}" stroke="#fff" stroke-opacity=".5" style="display:none"/></svg><div class="tip"></div>`;
  box.innerHTML = s;
  const sv = box.querySelector('svg'), cur = box.querySelector('.cur'), tip = box.querySelector('.tip');
  const mv = e => {
    const r = sv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * Wd;
    let i = type === 'bar' ? Math.floor((x - Lm) / (IW / N)) : Math.round((x - Lm) / (IW / Math.max(1, N - 1))); i = Math.max(0, Math.min(N - 1, i));
    cur.setAttribute('x1', X(i)); cur.setAttribute('x2', X(i)); cur.style.display = 'block';
    tip.style.display = 'block'; tip.innerHTML = `<b>${lb[i]}</b> ` + ser.map(z => `<span style="color:${z.c}">${z.n ? z.n + ' ' : ''}${z.d[i] == null ? '-' : Math.round(z.d[i] * 10) / 10}${u}</span>`).join(' · ');
  };
  sv.addEventListener('pointermove', mv); sv.addEventListener('pointerdown', mv);
}
async function drawDash(n) {
  RANGE = n; const o = $('dash'); o.innerHTML = `<div class="win sub">${t('load')}</div>`;
  try {
    const S = await series(n), lo = S.lo || S.hi, av = a => a.reduce((x, y) => x + (y || 0), 0) / a.length, mean = (av(S.hi) + av(lo)) / 2, mxT = Math.max(...S.hi), mnT = Math.min(...lo);
    const kp = [[t('kavg'), Math.round(mean) + '°', tc(mean)], [t('kmax'), Math.round(mxT) + '°', tc(mxT)], [t('kmin'), Math.round(mnT) + '°', tc(mnT)], [t('ktr'), S.rain.reduce((a, b) => a + (b || 0), 0).toFixed(0) + ' mm'], [t('krd'), S.rain.filter(x => x > (n === 1 ? .1 : 1)).length + (n === 1 ? ' h' : '')], [t('kw'), Math.round(Math.max(...S.wind)) + ' km/h']];
    const win = (id, ti, de) => `<section class="win"><h3>${ti}</h3><div class="sub">${de || ''}</div><div class="cb" id="${id}"></div></section>`;
    o.innerHTML = `<section class="win"><div class="kpis">${kp.map(x => `<div><small>${x[0]}</small><b style="color:${x[2] || '#fff'}">${x[1]}</b></div>`).join('')}</div></section>` + win('c1', t('cT'), t('cTd')) + win('c2', t('cR'), 'mm') + win('c3', t('cW'), 'km/h');
    chart($('c1'), S.lb, S.lo ? [{ d: S.hi, c: '#ff9a62', n: t('hi') }, { d: S.lo, c: '#6fc8ff', n: t('lo') }] : [{ d: S.hi, c: '#ff9a62', n: t('temp') }], 'band', '°');
    chart($('c2'), S.lb, [{ d: S.rain, c: '#fff' }], 'bar', ' mm');
    chart($('c3'), S.lb, [{ d: S.wind, c: '#7ff0d0' }], 'band', ' km/h');
  } catch (e) { o.innerHTML = `<div class="win err">${e.message}</div>`; }
}

/* ---------- start ---------- */
async function load(name) {
  $('msg').className = 'sub'; $('msg').textContent = t('load');
  try {
    place = name ? await findCity(name) : place; W = await getWeather(place); render();
    $('msg').textContent = ''; $('app').hidden = false;
    try { localStorage.setItem('city', place.name.split(',')[0]); } catch (e) { }
  } catch (e) { $('msg').className = 'err'; $('msg').textContent = e.message; }
}
function applyLang() {
  document.documentElement.lang = L;
  document.querySelectorAll('[data-i]').forEach(e => e.textContent = t(e.dataset.i));
  document.querySelectorAll('[data-p]').forEach(e => e.placeholder = t(e.dataset.p));
  if (W) render();
}
function tabs(id, fn) { $(id).onclick = e => { const b = e.target.closest('button'); if (!b) return; $(id).querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); fn(b); }; }
tabs('ftabs', b => { $('hourly').hidden = b.dataset.v !== 'hourly'; $('daily').hidden = b.dataset.v !== 'daily'; });
tabs('dtabs', b => drawDash(+b.dataset.n));
$('go').onclick = () => { const v = $('q').value.trim(); if (v) load(v); };
$('q').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('cmpb').onclick = compare; $('q2').onkeydown = e => { if (e.key === 'Enter') compare(); };
$('lang').onchange = e => { L = e.target.value; try { localStorage.setItem('lang', L); } catch (x) { } applyLang(); };
let saved = null;
try { saved = localStorage.getItem('city'); L = localStorage.getItem('lang') || 'en'; } catch (e) { }
$('lang').value = L; applyLang(); load(saved || 'Delhi');
</script>
</body>
